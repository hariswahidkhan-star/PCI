text x="645" y="54" font-size="9.5" fill="#1A1A1A">Average cycle time, weeks</text><line x1="618" y1="69" x2="640" y2="69" stroke="#8A5A00" stroke-width="2.6" stroke-dasharray="7 4"/><text x="645" y="73" font-size="9.5" fill="#1A1A1A">Blocked WIP, % of team WIP</text><text x="618" y="106" font-size="9.6" fill="#1A1A1A" font-weight="600">Meridian as designed:</text><text x="618" y="120" font-size="9.6" fill="#1A1A1A" font-weight="400">M = 4, L = 2 &#8594; E[wait] 4.0 wk</text><text x="618" y="134" font-size="9.6" fill="#5A6560" font-weight="400">(Domain 3, KA 3.2.3) &#8212; two</text><text x="618" y="148" font-size="9.6" fill="#5A6560" font-weight="400">whole iterations of waiting.</text><text x="618" y="162" font-size="9.6" fill="#8A5A00" font-weight="600">3.60 items parked = 20.0 %</text><text x="618" y="176" font-size="9.6" fill="#8A5A00" font-weight="400">of the team&#8217;s WIP. Blocked</text><text x="618" y="190" font-size="9.6" fill="#8A5A00" font-weight="400">items take 6.40 weeks against</text><text x="618" y="204" font-size="9.6" fill="#8A5A00" font-weight="600">2.40 for the rest &#8212; 2.667&#215;.</text><text x="618" y="218" font-size="9.6" fill="#5A6560" font-weight="400">Both lines are linear in</text><text x="618" y="232" font-size="9.6" fill="#5A6560" font-weight="400">E[wait], so the whole cost of</text><text x="618" y="246" font-size="9.6" fill="#1A1A1A" font-weight="600">a governance cadence is read</text><text x="618" y="260" font-size="9.6" fill="#1A1A1A" font-weight="600">off one horizontal axis.</text><line x1="88" y1="376" x2="570" y2="376" stroke="#1A1A1A" stroke-width="1.2"/><line x1="88" y1="42" x2="88" y2="376" stroke="#1A1A1A" stroke-width="1.2"/><text x="329.0" y="410" font-size="12" fill="#5A6560" text-anchor="middle">Governance latency E[wait] = M/2 + L (weeks)</text><text x="36" y="209.0" font-size="12" fill="#5A6560" text-anchor="middle" transform="rotate(-90 36 209.0)">Average cycle time (weeks)</text></svg>