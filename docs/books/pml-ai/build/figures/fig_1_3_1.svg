<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="700" height="330" fill="white"/><defs><marker id="vc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="vcr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C13329"/></marker></defs><text x="30" y="44" font-size="12.5" font-weight="700" fill="#0F172A">Each link can fail independently — an output claimed as a benefit overstates by construction</text><rect x="30" y="96" width="148" height="72" rx="8" fill="white" stroke="#1D4ED8" stroke-width="2.2"/><text x="104.0" y="123" font-size="11.5" font-weight="800" fill="#1D4ED8" text-anchor="middle">OUTPUT</text><text x="104.0" y="142" font-size="9.5" fill="#64748B" text-anchor="middle">40 clinics</text><text x="104.0" y="156" font-size="9.5" fill="#64748B" text-anchor="middle">installed</text><line x1="181" y1="132" x2="198" y2="132" stroke="#64748B" stroke-width="2" marker-end="url(#vc)"/><rect x="202" y="96" width="148" height="72" rx="8" fill="white" stroke="#0F172A" stroke-width="2.2"/><text x="276.0" y="123" font-size="11.5" font-weight="800" fill="#0F172A" text-anchor="middle">OUTCOME</text><text x="276.0" y="142" font-size="9.5" fill="#64748B" text-anchor="middle">28 clinics using it</text><text x="276.0" y="156" font-size="9.5" fill="#64748B" text-anchor="middle">(70 %)</text><line x1="353" y1="132" x2="370" y2="132" stroke="#64748B" stroke-width="2" marker-end="url(#vc)"/><rect x="374" y="96" width="148" height="72" rx="8" fill="white" stroke="#0F172A" stroke-width="2.2"/><text x="448.0" y="123" font-size="11.5" font-weight="800" fill="#0F172A" text-anchor="middle">BENEFIT</text><text x="448.0" y="142" font-size="9.5" fill="#64748B" text-anchor="middle">USD 685,440 / year</text><text x="448.0" y="156" font-size="9.5" fill="#64748B" text-anchor="middle">released</text><line x1="525" y1="132" x2="542" y2="132" stroke="#64748B" stroke-width="2" marker-end="url(#vc)"/><rect x="546" y="96" width="148" height="72" rx="8" fill="white" stroke="#64748B" stroke-width="2.2"/><text x="620.0" y="123" font-size="11.5" font-weight="800" fill="#64748B" text-anchor="middle">VALUE</text><text x="620.0" y="142" font-size="9.5" fill="#64748B" text-anchor="middle">benefit vs cost and</text><text x="620.0" y="156" font-size="9.5" fill="#64748B" text-anchor="middle">risk</text><line x1="190.0" y1="176" x2="190.0" y2="222" stroke="#C13329" stroke-width="2.2" marker-end="url(#vcr)"/><text x="200.0" y="206" font-size="11" font-weight="700" fill="#C13329">30 % leaks here</text><text x="200.0" y="222" font-size="10" fill="#C13329">USD 293,760 of claimed value that never existed</text><text x="30" y="276" font-size="10.5" fill="#64748B">Adoption is the outcome measure that links an output to any benefit at all — so it needs its own owner (Toolkit 1.T.1).</text></svg>