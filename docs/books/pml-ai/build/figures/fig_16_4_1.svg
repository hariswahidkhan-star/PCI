.2" font-size="10.2" fill="#14432E" text-anchor="middle" font-weight="600">+340,156</text><text x="749.9" y="474.0" font-size="9.7" fill="#1A1A1A" text-anchor="middle" font-weight="400">Improvement</text><text x="749.9" y="486.0" font-size="9.7" fill="#1A1A1A" text-anchor="middle" font-weight="400">plan</text><rect x="805.6" y="381.2" width="43.3" height="2.8" fill="#14432E" opacity="1"/><line x1="771.6" y1="381.2" x2="805.6" y2="381.2" stroke="#5A6560" stroke-width="0.9" stroke-dasharray="3 3"/><text x="827.3" y="373.2" font-size="10.2" fill="#1A1A1A" text-anchor="middle" font-weight="700">+35,329</text><text x="827.3" y="474.0" font-size="9.7" fill="#1A1A1A" text-anchor="middle" font-weight="700">Post&#8722;plan</text><text x="827.3" y="486.0" font-size="9.7" fill="#1A1A1A" text-anchor="middle" font-weight="700">NPV</text><text x="92" y="32" font-size="13.6" fill="#1A1A1A" font-weight="700">The closing account of Meridian Care Records</text><text x="92" y="50" font-size="10.7" fill="#5A6560">NPV, USD, eight years at 7 % (AF = 5.971299). From what the business case promised to what was measured, and what the</text><text x="92" y="63" font-size="10.7" fill="#5A6560">post&#8722;project improvement plan recovers. Blue columns are positions; crimson movements are losses; the outlined column is the only gain.</text><line x1="92" y1="502" x2="860" y2="502" stroke="#DCE3DE"/><text x="92" y="520" font-size="10.3" fill="#1A1A1A">Measured steady state: 27 of 40 clinics in daily use (67.50 %) releasing 5.4 clinician&#8722;hours per week &#8212; <tspan font-weight="600">USD 594,864</tspan> a year, <tspan font-weight="600">60.75 %</tspan> of the flat claim and <tspan font-weight="600">86.79 %</tspan> of the honest case.</text><text x="92" y="535" font-size="10.3" fill="#5A6560">The realised position is negative only because the approved case carried no operating&#8722;cost line; the account turns positive on USD 180,000 of post&#8722;project adoption work that no project plan contained.</text><text x="92" y="550" font-size="9.8" fill="#5A6560">Source: PCI original.</text></svg>