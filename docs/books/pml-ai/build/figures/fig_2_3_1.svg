<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="720" height="420" fill="white"/><defs><marker id="bm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><text x="24" y="26" font-size="11.5" font-weight="700" fill="#0F172A">Each link can fail independently — and the highlighted column is the one most maps omit</text><rect x="19" y="52" width="134" height="330" rx="8" fill="#1D4ED8" opacity="0"/><text x="86.0" y="70" font-size="10" font-weight="800" fill="#1D4ED8" text-anchor="middle">OUTPUTS</text><rect x="24" y="84" width="124" height="55" rx="5" fill="white" stroke="#1D4ED8" stroke-width="1.5"/><text x="86.0" y="101" font-size="8.4" fill="#0F172A" text-anchor="middle">Records system</text><text x="86.0" y="113" font-size="8.4" fill="#0F172A" text-anchor="middle">installed (40</text><text x="86.0" y="125" font-size="8.4" fill="#0F172A" text-anchor="middle">clinics)</text><rect x="24" y="146" width="124" height="34" rx="5" fill="white" stroke="#1D4ED8" stroke-width="1.5"/><text x="86.0" y="163" font-size="8.4" fill="#0F172A" text-anchor="middle">Data migrated</text><rect x="24" y="208" width="124" height="34" rx="5" fill="white" stroke="#1D4ED8" stroke-width="1.5"/><text x="86.0" y="225" font-size="8.4" fill="#0F172A" text-anchor="middle">Interfaces live</text><text x="86.0" y="372" font-size="8.6" fill="#1D4ED8" text-anchor="middle" font-weight="600">Programme</text><line x1="154" y1="200" x2="164" y2="200" stroke="#64748B" stroke-width="2" marker-end="url(#bm)"/><rect x="165" y="52" width="134" height="330" rx="8" fill="#C13329" opacity="0.07"/><text x="232.0" y="70" font-size="10" font-weight="800" fill="#C13329" text-anchor="middle">ENABLING CHANGE</text><rect x="170" y="84" width="124" height="34" rx="5" fill="white" stroke="#C13329" stroke-width="1.5"/><text x="232.0" y="101" font-size="8.4" fill="#0F172A" text-anchor="middle">Clinicians trained</text><rect x="170" y="146" width="124" height="42" rx="5" fill="white" stroke="#C13329" stroke-width="1.5"/><text x="232.0" y="163" font-size="8.4" fill="#0F172A" text-anchor="middle">Workflows</text><text x="232.0" y="175" font-size="8.4" fill="#0F172A" text-anchor="middle">redesigned</text><rect x="170" y="208" width="124" height="42" rx="5" fill="white" stroke="#C13329" stroke-width="1.5"/><text x="232.0" y="225" font-size="8.4" fill="#0F172A" text-anchor="middle">Clinical champions</text><text x="232.0" y="237" font-size="8.4" fill="#0F172A" text-anchor="middle">in place</text><rect x="170" y="270" width="124" height="42" rx="5" fill="white" stroke="#C13329" stroke-width="1.5"/><text x="232.0" y="287" font-size="8.4" fill="#0F172A" text-anchor="middle">Legacy process</text><text x="232.0" y="299" font-size="8.4" fill="#0F172A" text-anchor="middle">retired</text><text x="232.0" y="372" font-size="8.6" fill="#C13329" text-anchor="middle" font-weight="600">Owned OUTSIDE the project</text><line x1="300" y1="200" x2="310" y2="200" stroke="#64748B" stroke-width="2" marker-end="url(#bm)"/><rect x="311" y="52" width="134" height="330" rx="8" fill="#0F172A" opacity="0"/><text x="378.0" y="70" font-size="10" font-weight="800" fill="#0F172A" text-anchor="middle">OUTCOME</text><rect x="316" y="84" width="124" height="68" rx="5" fill="white" stroke="#0F172A" stroke-width="1.5"/><text x="378.0" y="101" font-size="8.4" fill="#0F172A" text-anchor="middle">28 clinics using</text><text x="378.0" y="113" font-size="8.4" fill="#0F172A" text-anchor="middle">it in daily</text><text x="378.0" y="125" font-size="8.4" fill="#0F172A" text-anchor="middle">practice (70 %</text><text x="378.0" y="137" font-size="8.4" fill="#0F172A" text-anchor="middle">adoption)</text><text x="378.0" y="372" font-size="8.6" fill="#0F172A" text-anchor="middle" font-weight="600">Clinical directorate</text><line x1="446" y1="200" x2="456" y2="200" stroke="#64748B" stroke-width="2" marker-end="url(#bm)"/><rect x="457" y="52" width="134" height="330" rx="8" fill="#0F172A" opacity="0"/><text x="524.0" y="70" font-size="10" font-weight="800" fill="#0F172A" text-anchor="middle">BENEFIT</text><rect x="462" y="84" width="124" height="68" rx="5" fill="white" stroke="#0F172A" stroke-width="1.5"/><text x="524.0" y="101" font-size="8.4" fill="#0F172A" text-anchor="middle">6</text><text x="524.0" y="113" font-size="8.4" fill="#0F172A" text-anchor="middle">clinician-hours/week</text><text x="524.0" y="125" font-size="8.4" fill="#0F172A" text-anchor="middle">per adopting</text><text x="524.0" y="137" font-size="8.4" fill="#0F172A" text-anchor="middle">clinic</text><rect x="462" y="146" width="124" height="42" rx="5" fill="white" stroke="#0F172A" stroke-width="1.5"/><text x="524.0" y="163" font-size="8.4" fill="#0F172A" text-anchor="middle">= USD 685,440 per</text><text x="524.0" y="175" font-size="8.4" fill="#0F172A" text-anchor="middle">year</text><text x="524.0" y="372" font-size="8.6" fill="#0F172A" text-anchor="middle" font-weight="600">Ops director</text><line x1="592" y1="200" x2="602" y2="200" stroke="#64748B" stroke-width="2" marker-end="url(#bm)"/><rect x="603" y="52" width="134" height="330" rx="8" fill="#64748B" opacity="0"/><text x="670.0" y="70" font-size="10" font-weight="800" fill="#64748B" text-anchor="middle">OBJECTIVE</text><rect x="608" y="84" width="124" height="55" rx="5" fill="white" stroke="#64748B" stroke-width="1.5"/><text x="670.0" y="101" font-size="8.4" fill="#0F172A" text-anchor="middle">Improved access</text><text x="670.0" y="113" font-size="8.4" fill="#0F172A" text-anchor="middle">and clinician</text><text x="670.0" y="125" font-size="8.4" fill="#0F172A" text-anchor="middle">capacity</text><text x="670.0" y="372" font-size="8.6" fill="#64748B" text-anchor="middle" font-weight="600">Executive</text><text x="232.0" y="398" font-size="9.5" font-weight="700" fill="#C13329" text-anchor="middle">usually omitted — and where Meridian stalled at 40 %</text></svg>