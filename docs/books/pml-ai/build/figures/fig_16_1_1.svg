="middle">Production</text><text x="240.1" y="440.0" font-size="9.8" fill="#0F172A" text-anchor="middle">interfaces</text><rect x="291.1" y="80.8" width="35.8" height="331.2" fill="#64748B" opacity="0.28"/><text x="309.0" y="74.8" font-size="10.2" fill="#64748B" text-anchor="middle">98</text><text x="309.0" y="428.0" font-size="9.8" fill="#0F172A" text-anchor="middle">Network and</text><text x="309.0" y="440.0" font-size="9.8" fill="#0F172A" text-anchor="middle">devices</text><rect x="360.0" y="124.7" width="35.8" height="287.3" fill="#64748B" opacity="0.28"/><text x="377.9" y="118.7" font-size="10.2" fill="#64748B" text-anchor="middle">85</text><text x="377.9" y="428.0" font-size="9.8" fill="#0F172A" text-anchor="middle">Workflow</text><text x="377.9" y="440.0" font-size="9.8" fill="#0F172A" text-anchor="middle">sign&#8722;off</text><rect x="428.8" y="141.6" width="35.8" height="270.4" fill="#64748B" opacity="0.28"/><text x="446.7" y="135.6" font-size="10.2" fill="#64748B" text-anchor="middle">80</text><text x="446.7" y="428.0" font-size="9.8" fill="#0F172A" text-anchor="middle">Clinical</text><text x="446.7" y="440.0" font-size="9.8" fill="#0F172A" text-anchor="middle">champion</text><rect x="497.7" y="101.0" width="35.8" height="311.0" fill="#64748B" opacity="0.28"/><text x="515.6" y="95.0" font-size="10.2" fill="#64748B" text-anchor="middle">92</text><text x="515.6" y="428.0" font-size="9.8" fill="#0F172A" text-anchor="middle">Fallback</text><text x="515.6" y="440.0" font-size="9.8" fill="#0F172A" text-anchor="middle">rehearsed</text><polyline points="102.4,87.5 171.3,120.0 240.1,137.5 309.0,143.0 377.9,183.3 446.7,229.1 515.6,243.7" fill="none" stroke="#1D4ED8" stroke-width="2.6"/><circle cx="102.4" cy="87.5" r="3.4" fill="#1D4ED8"/><text x="109.4" y="80.5" font-size="10.2" fill="#1D4ED8" font-weight="600">96.00</text><circle cx="171.3" cy="120.0" r="3.4" fill="#1D4ED8"/><circle cx="240.1" cy="137.5" r="3.4" fill="#1D4ED8"/><circle cx="309.0" cy="143.0" r="3.4" fill="#1D4ED8"/><circle cx="377.9" cy="183.3" r="3.4" fill="#1D4ED8"/><text x="384.9" y="176.3" font-size="10.2" fill="#1D4ED8" font-weight="600">67.65</text><circle cx="446.7" cy="229.1" r="3.4" fill="#1D4ED8"/><text x="453.7" y="222.1" font-size="10.2" fill="#1D4ED8" font-weight="600">54.12</text><circle cx="515.6" cy="243.7" r="3.4" fill="#1D4ED8"/><text x="522.6" y="236.7" font-size="10.2" fill="#1D4ED8" font-weight="600">49.79</text><line x1="68" y1="105.4" x2="550.0" y2="105.4" stroke="#C13329" stroke-width="1.4" stroke-dasharray="6 4"/><text x="72" y="98.4" font-size="10.4" fill="#C13329" font-weight="600">dashboard average 90.71 % &#8212; &#8220;amber&#8211;green&#8221;</text><line x1="534.0" y1="105.4" x2="534.0" y2="243.7" stroke="#0F172A" stroke-width="1"/><line x1="529.0" y1="105.4" x2="539.0" y2="105.4" stroke="#0F172A" stroke-width="1"/><line x1="529.0" y1="243.7" x2="539.0" y2="243.7" stroke="#0F172A" stroke-width="1"/><text x="525.0" y="174.5" font-size="10.4" fill="#0F172A" text-anchor="end" font-weight="600">gap 40.92 pp</text><text x="68" y="28" font-size="13.4" fill="#0F172A" font-weight="700">Readiness is a conjunction, not an average</text><text x="68" y="46" font-size="10.6" fill="#64748B">Seven go&#8722;live conditions for one Meridian clinic: assessed probability per condition (columns) against the running</text><text x="68" y="59" font-size="10.6" fill="#64748B">product &#8719;p (line). P(clean go&#8722;live) = 49.79 %.</text><text x="584" y="46" font-size="10.8" fill="#0F172A" font-weight="700">Gain in P(clean go&#8722;live)</text><text x="584" y="59" font-size="10.2" fill="#64748B">from lifting one condition to 0.98</text><text x="584" y="88.0" font-size="9.9" fill="#0F172A">Clinical champion<tspan fill="#64748B"> &#215;1.2250</tspan></text><rect x="584" y="92.0" width="128.0" height="10" fill="#1D4ED8" opacity="0.82"/><text x="717.0" y="101.0" font-size="9.9" fill="#1D4ED8" font-weight="600">+11.20 pp</text><text x="584" y="118.0" font-size="9.9" fill="#0F172A">Workflow sign&#8722;off<tspan fill="#64748B"> &#215;1.1529</tspan></text><rect x="584" y="122.0" width="87.0" height="10" fill="#1D4ED8" opacity="0.82"/><text x="676.0" y="131.0" font-size="9.9" fill="#1D4ED8" font-weight="600">+7.62 pp</text><text x="584" y="148.0" font-size="9.9" fill="#0F172A">Data migration<tspan fill="#64748B"> &#215;1.0889</tspan></text><rect x="584" y="152.0" width="50.6" height="10" fill="#1D4ED8" opacity="0.82"/><text x="639.6" y="161.0" font-size="9.9" fill="#1D4ED8" font-weight="600">+4.43 pp</text><text x="584" y="178.0" font-size="9.9" fill="#0F172A">Fallback rehearsed<tspan fill="#64748B"> &#215;1.0652</tspan></text><rect x="584" y="182.0" width="37.1" height="10" fill="#1D4ED8" opacity="0.82"/><text x="626.1" y="191.0" font-size="9.9" fill="#1D4ED8" font-weight="600">+3.25 pp</text><text x="584" y="208.0" font-size="9.9" fill="#0F172A">Production interfaces<tspan fill="#64748B"> &#215;1.0426</tspan></text><rect x="584" y="212.0" width="24.2" height="10" fill="#1D4ED8" opacity="0.82"/><text x="613.2" y="221.0" font-size="9.9" fill="#1D4ED8" font-weight="600">+2.12 pp</text><text x="584" y="238.0" font-size="9.9" fill="#0F172A">Clinician training<tspan fill="#64748B"> &#215;1.0208</tspan></text><rect x="584" y="242.0" width="11.9" height="10" fill="#1D4ED8" opacity="0.82"/><text x="600.9" y="251.0" font-size="9.9" fill="#1D4ED8" font-weight="600">+1.04 pp</text><line x1="68" y1="464" x2="760" y2="464" stroke="#E2E8F0"/><text x="68" y="482" font-size="10.3" fill="#0F172A">All seven conditions at 0.98 gives a conjunction of only <tspan font-weight="600">86.81 %</tspan>; a 95 % chance of a clean go&#8722;live requires <tspan font-weight="600">99.27 %</tspan> on every one of the seven.</text><text x="68" y="497" font-size="10.3" fill="#64748B">Independence is an assumption stated, not proved: perfectly correlated failures give the optimistic bound min(p) = 80.00 %. Both bounds are used in the hold&#8722;or&#8722;go decision.</text><text x="68" y="512" font-size="9.8" fill="#64748B">Assessed probabilities are locally calibrated planning figures for one clinic, not constants. Source: PCI original.</text></svg>