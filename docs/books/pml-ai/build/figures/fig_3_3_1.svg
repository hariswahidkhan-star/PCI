<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="700" height="330" fill="white"/><text x="24" y="26" font-size="11.5" font-weight="700" fill="#0F172A">Count the tiers, add the latency, price it &#8212; then justify each tier against its cost</text><rect x="210.0" y="62" width="42.6" height="34" fill="#64748B" opacity="0.9"/><text x="231.3" y="84" font-size="10.5" font-weight="700" fill="white" text-anchor="middle">2 w</text><rect x="252.6" y="62" width="85.2" height="34" fill="#1D4ED8" opacity="0.9"/><text x="295.2" y="84" font-size="10.5" font-weight="700" fill="white" text-anchor="middle">4 w</text><rect x="337.7" y="62" width="202.3" height="34" fill="#C13329" opacity="0.9"/><text x="438.9" y="84" font-size="10.5" font-weight="700" fill="white" text-anchor="middle">9.5 w</text><text x="200" y="77" font-size="11" font-weight="700" fill="#0F172A" text-anchor="end">As designed</text><text x="200" y="91" font-size="9.6" fill="#64748B" text-anchor="end">three tiers</text><text x="550" y="77" font-size="11" font-weight="800" fill="#0F172A">15.5 weeks</text><text x="550" y="91" font-size="10.5" font-weight="700" fill="#C13329">USD 221,340</text><text x="438.9" y="112" font-size="10" font-weight="700" fill="#C13329" text-anchor="middle">61 % of the latency &#8212; USD 135,660</text><rect x="210" y="148" width="85.2" height="34" fill="#1D4ED8"/><text x="303.2" y="170" font-size="10.5" font-weight="700" fill="#0F172A">4 w &#183; USD 57,120</text><text x="200" y="163" font-size="11" font-weight="700" fill="#0F172A" text-anchor="end">One tier, executive informed</text><text x="200" y="177" font-size="9.6" fill="#64748B" text-anchor="end">programme board only</text><text x="676" y="163" font-size="10.5" font-weight="800" fill="#1D4ED8" text-anchor="end">saves USD 164,220</text><text x="676" y="177" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="end">74.2 %</text><rect x="210" y="210" width="26.0" height="34" fill="#0F8A5F"/><text x="244.0" y="232" font-size="10.5" font-weight="700" fill="#0F172A">1 w &#183; USD 14,280</text><text x="200" y="225" font-size="11" font-weight="700" fill="#0F172A" text-anchor="end">One tier, written resolution</text><text x="200" y="239" font-size="9.6" fill="#64748B" text-anchor="end">5 working days</text><text x="676" y="225" font-size="10.5" font-weight="800" fill="#0F8A5F" text-anchor="end">saves USD 207,060</text><text x="676" y="239" font-size="10" font-weight="700" fill="#0F8A5F" text-anchor="end">93.5 %</text><line x1="210" y1="278" x2="676" y2="278" stroke="#E2E8F0" stroke-width="1.2"/><text x="210" y="300" font-size="10.2" fill="#64748B">Each tier&#8217;s wait is M/2 + L: 2/2+1 = 2.0 &#183; 4/2+2 = 4.0 &#183; 13/2+3 = 9.5 &#8212; priced at USD 14,280 per week</text></svg>