xt><text x="630" y="350" font-size="9.8" fill="#8A5A00" font-weight="700">Crimson circles: the</text><text x="630" y="363" font-size="9.8" fill="#8A5A00" font-weight="700">gearing at which each</text><text x="630" y="376" font-size="9.8" fill="#8A5A00" font-weight="700">threshold binds</text><text x="24" y="28" font-size="12.5" font-weight="700" fill="#1A1A1A">Gearing is a transfer to equity, not an efficiency for the project</text><text x="24" y="46" font-size="10.4" fill="#5A6560">Kestrel Water SPC: level CFADS 6,384,000; senior debt at 6.0 % over 12 years; cost of equity re-levered at each gearing</text><text x="24" y="61" font-size="10.4" fill="#8A5A00">The 1.30 &#215; sizing target binds at 68.62 % gearing; above 74.34 % the 1.20 &#215; covenant fails on base-case cash, before any stress</text><text x="326.0" y="456" font-size="11.2" font-weight="600" fill="#1A1A1A" text-anchor="middle">The structure is chosen by the coverage constraint; the cost of capital is the consequence</text></svg>