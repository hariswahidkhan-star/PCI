<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="640" height="470" fill="white"/><polygon points="320.0,62 96,396 544,396" fill="#1D4ED8" opacity="0.05" stroke="#1D4ED8" stroke-width="2.4"/><text x="320.0" y="32" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle">VALUE</text><text x="320.0" y="48" font-size="9.5" fill="#64748B" text-anchor="middle">worth doing — NPV (Domain 4)</text><text x="96" y="420" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle">CASH</text><text x="96" y="436" font-size="9.5" fill="#64748B" text-anchor="middle">arrives when needed (D6–8)</text><text x="544" y="420" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle">RISK</text><text x="544" y="436" font-size="9.5" fill="#64748B" text-anchor="middle">sits with those who can bear it (D11–12)</text><text x="320.0" y="288.6666666666667" font-size="12.5" font-weight="800" fill="#C13329" text-anchor="middle">BANKABLE</text><text x="320.0" y="305.6666666666667" font-size="9.5" fill="#64748B" text-anchor="middle">all three, together (Domain 5)</text><text x="194.0" y="229.0" font-size="9" fill="#64748B" text-anchor="end" transform="rotate(-60 194.0 229.0)">no risk corner → repriced at close</text><text x="446.0" y="229.0" font-size="9" fill="#64748B" transform="rotate(60 446.0 229.0)">no cash corner → liquidity failure</text><text x="320.0" y="384" font-size="9" fill="#64748B" text-anchor="middle">no value corner → no equity</text></svg>