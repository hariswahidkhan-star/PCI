ght="600">E &#183; insurance placement and endorsements</text><text x="248" y="381.7" font-size="9.2" fill="#5A6560" text-anchor="end">7 wk &#183; float 13 &#183; slip 2 wk at p 0.15 &#183; risk weight 0.30</text><text x="568" y="371.7" font-size="10" font-weight="700" fill="#5A6560">absorbed by float</text><line x1="491.2" y1="92" x2="491.2" y2="404" stroke="#1A1A1A" stroke-width="1.6"/><text x="497.2" y="86" font-size="10.4" font-weight="700" fill="#1A1A1A">base close 20 wk</text><line x1="518.8" y1="92" x2="518.8" y2="404" stroke="#8A5A00" stroke-width="1.6" stroke-dasharray="5 4"/><text x="524.8" y="99.0" font-size="10.4" font-weight="700" fill="#8A5A00">E[close] 22.4075 wk</text><text x="568.0" y="260.4" font-size="10.4" font-weight="700" fill="#1A1A1A">Close-date distribution</text><rect x="612.0" y="273.4" width="53.5" height="11" fill="#1A1A1A" opacity="0.85"/><text x="568.0" y="282.4" font-size="9.8" fill="#5A6560">20 wk</text><text x="669.5" y="282.4" font-size="9.8" font-weight="700" fill="#1A1A1A">34.125 %</text><rect x="612.0" y="292.4" width="17.8" height="11" fill="#5A6560" opacity="0.85"/><text x="568.0" y="301.4" font-size="9.8" fill="#5A6560">22 wk</text><text x="633.8" y="301.4" font-size="9.8" font-weight="700" fill="#5A6560">11.375 %</text><rect x="612.0" y="311.4" width="85.4" height="11" fill="#8A5A00" opacity="0.85"/><text x="568.0" y="320.4" font-size="9.8" fill="#5A6560">24 wk</text><text x="701.4" y="320.4" font-size="9.8" font-weight="700" fill="#8A5A00">54.500 %</text><line x1="262" y1="404" x2="560" y2="404" stroke="#1A1A1A" stroke-width="1.2"/><line x1="262" y1="100" x2="262" y2="404" stroke="#1A1A1A" stroke-width="1.2"/><text x="411.0" y="438" font-size="12" fill="#5A6560" text-anchor="middle">Weeks from mandate to satisfaction of the chain&#8217;s last condition</text><text x="210" y="252.0" font-size="12" fill="#5A6560" text-anchor="middle" transform="rotate(-90 210 252.0)"></text><text x="24" y="26" font-size="12.5" font-weight="700" fill="#1A1A1A">The close date is the expected maximum of the chains, not the expected duration of the critical one</text><text x="24" y="45" font-size="10.4" fill="#5A6560">Five chains, each individually likely to hold its date &#8212; and only a 34.125 % chance that the close holds its own</text><text x="24" y="61" font-size="10.4" fill="#8A5A00">Expected slip 2.4075 wk = 298,851; chain C&#8217;s own expected slip is 1.2 wk = 148,960. The conjunction premium is 149,891</text><text x="24" y="77" font-size="10.4" fill="#14432E">Chain B carries the largest risk weight (2.10) and is not the critical path: de-risking it to p 0.10 is worth 76,031.67</text><text x="411.0" y="455" font-size="11.2" font-weight="600" fill="#1A1A1A" text-anchor="middle">Blue: chain duration. Grey: float. Crimson: the slip that float cannot absorb</text></svg>