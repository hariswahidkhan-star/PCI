" font-size="12.5" font-weight="700" fill="#0F172A">Six conditions averaging 90.5 % give a 54.7 % chance of financial close</text><text x="24" y="41" font-size="10.4" fill="#64748B">Bars: each condition met on the target timetable. Line: the running product. Lifting the weakest from 0.85 to 0.95 adds 6.44 points; lifting the strongest from 0.95 to 0.98 adds 1.73</text><text x="376.0" y="388" font-size="11.4" font-weight="600" fill="#0F172A" text-anchor="middle">The weakest condition governs &#8212; and no amount of strength elsewhere repairs it</text></svg>