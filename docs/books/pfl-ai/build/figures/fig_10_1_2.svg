<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="760" height="470" fill="white"/><text x="82" y="30" font-size="13.4" fill="#0F172A" font-weight="700">Three ways to size the same project at 1.30&#215;</text><text x="82" y="49" font-size="10.6" fill="#64748B">Requiring 1.30&#215; in every period rather than in year one costs <tspan fill="#0F172A" font-weight="600">2,917,226</tspan> of debt capacity;</text><text x="82" y="64" font-size="10.6" fill="#64748B">sculpting recovers <tspan fill="#1D4ED8" font-weight="600">1,661,916</tspan> of it without relaxing a single period&#8217;s requirement.</text><line x1="82" y1="402.0" x2="592" y2="402.0" stroke="#E2E8F0"/><text x="74" y="405.6" font-size="9.6" fill="#64748B" text-anchor="end">1.18</text><line x1="82" y1="375.5" x2="592" y2="375.5" stroke="#E2E8F0"/><text x="74" y="379.1" font-size="9.6" fill="#64748B" text-anchor="end">1.20</text><line x1="82" y1="349.0" x2="592" y2="349.0" stroke="#E2E8F0"/><text x="74" y="352.6" font-size="9.6" fill="#64748B" text-anchor="end">1.22</text><line x1="82" y1="322.5" x2="592" y2="322.5" stroke="#E2E8F0"/><text x="74" y="326.1" font-size="9.6" fill="#64748B" text-anchor="end">1.24</text><line x1="82" y1="296.0" x2="592" y2="296.0" stroke="#E2E8F0"/><text x="74" y="299.6" font-size="9.6" fill="#64748B" text-anchor="end">1.26</text><line x1="82" y1="269.5" x2="592" y2="269.5" stroke="#E2E8F0"/><text x="74" y="273.1" font-size="9.6" fill="#64748B" text-anchor="end">1.28</text><line x1="82" y1="243.0" x2="592" y2="243.0" stroke="#E2E8F0"/><text x="74" y="246.6" font-size="9.6" fill="#64748B" text-anchor="end">1.30</text><line x1="82" y1="216.5" x2="592" y2="216.5" stroke="#E2E8F0"/><text x="74" y="220.1" font-size="9.6" fill="#64748B" text-anchor="end">1.32</text><line x1="82" y1="190.0" x2="592" y2="190.0" stroke="#E2E8F0"/><text x="74" y="193.6" font-size="9.6" fill="#64748B" text-anchor="end">1.34</text><line x