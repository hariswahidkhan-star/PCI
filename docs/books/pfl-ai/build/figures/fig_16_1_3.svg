<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 570" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="820" height="570" fill="white"/><text x="92" y="22" font-size="11.8" font-weight="700" fill="#0F172A">The accuracy-maximising threshold is not the cost-minimising threshold</text><text x="92" y="38" font-size="9.4" fill="#64748B">48,000 payments and journal entries a year, 2.5 % genuinely anomalous. A false positive costs 40 to investigate; a missed error costs 320.</text><text x="92" y="51" font-size="9.4" fill="#64748B">Bars: total annual cost (left axis). Dashed line: classification accuracy (right axis).</text><text x="92" y="546" font-size="9.6" fill="#64748B">Act on an alert whenever the chance it is real exceeds 40 &#247; 320 = 12.5 %, one in eight. The optimum is where the marginal precision of</text><text x="92" y="560" font-size="9.6" fill="#64748B">loosening the threshold crosses that line &#8212; 17.9104 % from T3 to T4, and 5.7971 % from T4 to T5 &#8212; not where average precision looks respectable.</text><line x1="92" y1="353.0" x2="728" y2="353.0" stroke="#E2E8F0"/><text x="84" y="357.0" font-size="9.6" fill="#64748B" text-anchor="end">50k</text><line x1="92" y1="278.0" x2="728" y2="278.0" stroke="#E2E8F0"/><text x="84" y="282.0" font-size="9.6" fill="#64748B" text-anchor="end">100k</text><line x1="92" y1="203.0" x2="728" y2="203.0" stroke="#E2E8F0"/><text x="84" y="207.0" font-size="9.6" fill="#64748B" text-anchor="end">150k</text><line x1="92" y1="128.0" x2="728" y2="128.0" stroke="#E2E8F0"/><text x="84" y="132.0" font-size="9.6" fill="#64748B" text-anchor="end">200k</text><text x="738" y="388.6" font-size="9.6" fill="#C13329">93 %</text><text x="738" y="301.7" font-size="9.6" fill="#C13329">95 %</text><text x="738" y="214.9" font-size="9.6" fill="#C13329">97 %</text><text x="738" y="128.1" font-size="9.6" fill="#C13329">99 %</text><rect x="117.4" y="133.4" width="76.3" height="294.6" fill="#1D4ED8" opacity="0.85"/><text x="1