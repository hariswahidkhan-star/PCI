<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="700" height="440" fill="white"/><text x="24" y="26" font-size="12.5" font-weight="700" fill="#0F172A">Forty screened opportunities buy two financings &#8212; and the two must repay all forty</text><text x="24" y="44" font-size="10.4" fill="#64748B">Stage spend is the premium paid for the option to continue; only the last stage is spent on projects that close</text><rect x="150.0" y="62" width="340.0" height="46" rx="5" fill="#1D4ED8" opacity="0.30"/><text x="320.0" y="83" font-size="13" font-weight="800" fill="white" text-anchor="middle">40</text><text x="320.0" y="99" font-size="9.4" fill="white" text-anchor="middle">at 25,000 each</text><text x="138" y="83" font-size="10.8" font-weight="600" fill="#0F172A" text-anchor="end">Screening</text><text x="138" y="98" font-size="9.4" fill="#64748B" text-anchor="end">stage spend 1,000,000</text><text x="504" y="83" font-size="10.4" fill="#64748B">cumulative 1,000,000</text><rect x="252.3" y="136" width="135.3" height="46" rx="5" fill="#1D4ED8" opacity="0.52"/><text x="320.0" y="157" font-size="13" font-weight="800" fill="white" text-anchor="middle">12</text><text x="320.0" y="173" font-size="9.4" fill="white" text-anchor="middle">at 250,000 each</text><text x="138" y="157" font-size="10.8" font-weight="600" fill="#0F172A" text-anchor="end">Concept / prefeasibility</text><text x="138" y="172" font-size="9.4" fill="#64748B" text-anchor="end">stage spend 3,000,000</text><text x="504" y="157" font-size="10.4" fill="#64748B">cumulative 4,000,000</text><text x="504" y="172" font-size="9.4" fill="#C13329">conversion 12/40</text><rect x="277.9" y="210" width="84.2" height="46" rx="5" fill="#1D4ED8" opacity="0.74"/><text x="320.0" y="231" font-size="13" font-weight="800" fill="white" text-anchor="middle">5</text><text x="320.0" y="268" font-size="9.4" fill="#64748B" text-anchor="middle">at 1,200,000 each</text><text x="138" y="231" font-size="10.8" font-weight="600" fill="#0F172A" text-anchor="end">Feasibility and bid</text><text x="138" y="246" font-size="9.4" fill="#64748B" text-anchor="end">stage spend 6,000,000</text><text x="504" y="231" font-size="10.4" fill="#64748B">cumulative 10,000,000</text><text x="504" y="246" font-size="9.4" fill="#C13329">conversion 5/12</text><rect x="288.9" y="284" width="62.2" height="46" rx="5" fill="#1D4ED8" opacity="0.96"/><text x="320.0" y="305" font-size="13" font-weight="800" fill="white" text-anchor="middle">2</text><text x="320.0" y="342" font-size="9.4" fill="#64748B" text-anchor="middle">at 2,400,000 each</text><text x="138" y="305" font-size="10.8" font-weight="600" fill="#0F172A" text-anchor="end">To financial close</text><text x="138" y="320" font-size="9.4" fill="#64748B" text-anchor="end">stage spend 4,800,000</text><text x="504" y="305" font-size="10.4" fill="#64748B">cumulative 14,800,000</text><text x="504" y="320" font-size="9.4" fill="#C13329">conversion 2/5</text><line x1="24" y1="364" x2="676" y2="364" stroke="#E2E8F0" stroke-width="1.4"/><text x="24" y="388" font-size="11.6" font-weight="700" fill="#0F172A">Development cost per closed project 7,400,000</text><text x="24" y="405" font-size="10.6" fill="#64748B">Close rate 2/40 = 5.0 %. At a sponsor value of 16,179,360 per close the programme breaks even at</text><text x="24" y="420" font-size="10.6" fill="#C13329" font-weight="700">0.9147 closes &#8212; a breakeven close rate of 2.29 %, less than half the rate achieved</text></svg>