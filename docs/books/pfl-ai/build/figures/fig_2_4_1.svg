ext x="254" y="178.0" font-size="10.4" fill="#0F172A" text-anchor="end" font-weight="600">After-tax ROCE, opening capital</text><text x="254" y="190.5" font-size="9.2" fill="#64748B" text-anchor="end">4,080,000 &#247; 60,000,000</text><text x="437.5" y="180.7" font-size="10.4" font-weight="700" fill="#1D4ED8">6.8000 %</text><rect x="268" y="215.8" width="189.7" height="22.5" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 4"/><text x="254" y="227.0" font-size="10.4" fill="#0F172A" text-anchor="end" font-weight="600">WACC (Domain 9, KA 9.1.4)</text><text x="254" y="239.5" font-size="9.2" fill="#64748B" text-anchor="end">the external benchmark</text><text x="465.7" y="229.7" font-size="10.4" font-weight="700" fill="#64748B">7.9860 %</text><rect x="268" y="264.8" width="272.3" height="22.5" fill="#1D4ED8" opacity="0.88"/><text x="254" y="276.0" font-size="10.4" fill="#0F172A" text-anchor="end" font-weight="600">ROE, opening equity</text><text x="254" y="288.5" font-size="9.2" fill="#64748B" text-anchor="end">2,064,000 &#247; 18,000,000</text><text x="548.3" y="278.7" font-size="10.4" font-weight="700" fill="#1D4ED8">11.4667 %</text><rect x="268" y="313.8" width="297.6" height="22.5" fill="#0F172A" opacity="0.88"/><text x="254" y="325.0" font-size="10.4" fill="#0F172A" text-anchor="end" font-weight="600">Equity IRR over 12 years</text><text x="254" y="337.5" font-size="9.2" fill="#64748B" text-anchor="end">Domain 9, at 70 % gearing</text><text x="573.6" y="327.7" font-size="10.4" font-weight="700" fill="#0F172A">12.5311 %</text><rect x="268" y="362.8" width="366.2" height="22.5" fill="#C13329" opacity="0.88"/><text x="254" y="374.0" font-size="10.4" fill="#0F172A" text-anchor="end" font-weight="600">Cost of equity at 70 % gearing</text><text x="254" y="386.5" font-size="9.2" fill="#64748B" text-anchor="end">Domain 9, re-levered</text><text x="642.2" y="376.7" font-size="10.4" font-weight="700" fill="#C13329">15.4200 %</text><rect x="429.5" y="166.8" width="28.2" height="22.5" fill="#C13329" opacity="0.25"/><text x="461.7" y="159.8" font-size="9.6" font-weight="700" fill="#C13329">&#8722;1.1860 points against WACC</text><line x1="429.5" y1="295.3" x2="540.3" y2="295.3" stroke="#1D4ED8" stroke-width="2"/><line x1="429.5" y1="290.3" x2="429.5" y2="300.3" stroke="#1D4ED8" stroke-width="2"/><line x1="540.3" y1="290.3" x2="540.3" y2="300.3" stroke="#1D4ED8" stroke-width="2"/><text x="484.9" y="311.3" font-size="9.6" font-weight="700" fill="#1D4ED8" text-anchor="middle">the leverage wedge: 2.3333 &#215; 2.0000 = 4.6667 points</text><line x1="268" y1="400" x2="648" y2="400" stroke="#0F172A" stroke-width="1.2"/><line x1="268" y1="106" x2="268" y2="400" stroke="#0F172A" stroke-width="1.2"/><text x="458.0" y="434" font-size="12" fill="#64748B" text-anchor="middle">Per cent, year one of operations</text><text x="216" y="253.0" font-size="12" fill="#64748B" text-anchor="middle" transform="rotate(-90 216 253.0)"></text><text x="24" y="26" font-size="12.5" font-weight="700" fill="#0F172A">Six returns, one project, one year &#8212; and none of them is the project&#8217;s return</text><text x="24" y="45" font-size="10.4" fill="#1D4ED8">The identity is exact on opening bases: 6.8000 + 2.3333 &#215; (6.8000 &#8722; 4.8000) = 11.4667</text><text x="24" y="61" font-size="10.4" fill="#64748B">On closing equity the same profit gives 10.2871 %, on average equity 10.8449 % &#8212; 1.1796 points from the denominator alone</text><text x="24" y="77" font-size="10.4" fill="#C13329">Year-one accounting return sits below WACC on a project whose NPV is +16,179,360 and IRR 12.19 %</text><text x="458.0" y="448" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">ROE of 11.4667 % is neither the 12.5311 % equity earns nor the 15.42 % it requires</text></svg>