" fill="#0F172A" opacity="0.80"/><rect x="462.6" y="109.4" width="29.4" height="0.5" fill="#C13329"/><text x="477.3" y="390" font-size="10" fill="#64748B" text-anchor="middle">q7</text><text x="477.3" y="102.4" font-size="9.2" fill="#0F172A" text-anchor="middle" font-weight="600">720</text><rect x="515.1" y="178.5" width="29.4" height="195.5" fill="#1D4ED8" opacity="0.30"/><rect x="515.1" y="101.3" width="29.4" height="77.2" fill="#0F172A" opacity="0.80"/><text x="529.8" y="390" font-size="10" fill="#64748B" text-anchor="middle">COD</text><text x="529.8" y="94.3" font-size="9.2" fill="#0F172A" text-anchor="middle" font-weight="600">742</text><line x1="84" y1="374" x2="556" y2="374" stroke="#0F172A" stroke-width="1.2"/><line x1="84" y1="80" x2="84" y2="374" stroke="#0F172A" stroke-width="1.2"/><text x="320.0" y="408" font-size="12" fill="#64748B" text-anchor="middle">Point in the construction programme at which the slip is declared</text><text x="32" y="227.0" font-size="12" fill="#64748B" text-anchor="middle" transform="rotate(-90 32 227.0)">Cost of one month of slip (USD)</text><line x1="84" y1="153.5" x2="556" y2="153.5" stroke="#C13329" stroke-width="1.8" stroke-dasharray="6 4"/><text x="90" y="146.5" font-size="10.6" font-weight="700" fill="#C13329">delay damages 20,000/day = 600,000 per month</text><text x="564" y="105.3" font-size="10.4" font-weight="700" fill="#0F172A">742,000</text><text x="564" y="118.3" font-size="9.6" fill="#64748B">at COD (D5, KA 5.4.2)</text><text x="564" y="186.9" font-size="10" fill="#1D4ED8">deferred CFADS</text><text x="564" y="197.9" font-size="9.6" fill="#1D4ED8">532,000 &#8212; flat</text><text x="564" y="142.8" font-size="10" fill="#0F172A">extra interest</text><text x="564" y="153.8" font-size="9.6" fill="#0F172A">9,240 &#8594; 210,000</text><text x="564" y="115.2" font-size="10" fill="#C13329">escalation</text><text x="564" y="126.2" font-size="9.6" fill="#C13329">11,089 &#8594; 0</text><text x="24" y="26" font-size="12.5" font-weight="700" fill="#0F172A">A month of slip costs 552,329 at close and 742,000 at COD &#8212; the same month, 34.3 % dearer</text><text x="24" y="44" font-size="10.4" fill="#64748B">Escalation falls as the remaining scope runs out; interest rises as the balance builds. Only the deferred-revenue band is constant</text><text x="24" y="59" font-size="10.4" fill="#C13329">Damages calibrated at 20,000 per day cover the cost until quarter three and never again &#8212; the crossing is between q2 (580,033) and q3 (604,156)</text><text x="320.0" y="436" font-size="11.2" font-weight="600" fill="#0F172A" text-anchor="middle">A single damages rate cannot be right for a cost that moves 34.3 % across the programme it insures</text></svg>