<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="820" height="540" fill="white"/><text x="96" y="22" font-size="11.8" font-weight="700" fill="#1A1A1A">Where automation starts to pay &#8212; and what the error cost does to the answer</text><text x="96" y="38" font-size="9.4" fill="#5A6560">Net annual saving against the manual process. Committed automated fixed cost 148,000 a year;</text><text x="96" y="51" font-size="9.4" fill="#5A6560">manual review 13.60 a record at a loaded 96.00 an hour; automated variable 1.04 a record.</text><text x="96" y="514" font-size="9.6" fill="#5A6560">Raising the cost of an undetected error from 320 to 1,200 moves the breakeven from 14,800 records to 50,000: the more</text><text x="96" y="528" font-size="9.6" fill="#5A6560">consequential the error, the more volume automation needs &#8212; because its error rate is the higher of the two.</text><line x1="96" y1="441.4" x2="776" y2="441.4" stroke="#DCE3DE"/><text x="88" y="445.4" font-size="9.6" fill="#5A6560" text-anchor="end">&#8722;200k</text><line x1="96" y1="375.4" x2="776" y2="375.4" stroke="#DCE3DE"/><text x="88" y="379.4" font-size="9.6" fill="#5A6560" text-anchor="end">0k</text><line x1="96" y1="309.4" x2="776" y2="309.4" stroke="#DCE3DE"/><text x="88" y="313.4" font-size="9.6" fill="#5A6560" text-anchor="end">200k</text><line x1="96" y1="243.4" x2="776" y2="243.4" stroke="#DCE3DE"/><text x="88" y="247.4" font-size="9.6" fill="#5A6560" text-anchor="end">400k</text><line x1="96" y1="177.4" x2="776" y2="177.4" stroke="#DCE3DE"/><text x="88" y="181.4" font-size="9.6" fill="#5A6560" text-anchor="end">600k</text><line x1="193.1" y1="118" x2="193.1" y2="448" stroke="#DCE3DE"/><text x="193.1" y="465" font-size="9.6" fill="#5A6560" text-anchor="middle">10k</text><line x1="290.3" y1="118" x2="290.3" y2="448" stroke="#DCE3DE"/><text x="290.3" y="465" font-size="9.6" fill="#5A6560" text-anchor="middle">20k</text><line x1="387.4" y1="118" x2="387.4" y2="448" stroke="#DCE3DE"/><text x="387.4" y="465" font-size="9.6" fill="#5A6560" text-anchor="middle">30k</text><line x1="484.6" y1="118" x2="484.6" y2="448" stroke="#DCE3DE"/><text x="484.6" y="465" font-size="9.6" fill="#5A6560" text-anchor="middle">40k</text><line x1="581.7" y1="118" x2="581.7" y2="448" stroke="#DCE3DE"/><text x="581.7" y="465" font-size="9.6" fill="#5A6560" text-anchor="middle">50k</text><line x1="678.9" y1="118" x2="678.9" y2="448" stroke="#DCE3DE"/><text x="678.9" y="465" font-size="9.6" fill="#5A6560" text-anchor="middle">60k</text><line x1="776.0" y1="118" x2="776.0" y2="448" stroke="#DCE3DE"/><text x="776.0" y="465" font-size="9.6" fill="#5A6560" text-anchor="middle">70k</text><line x1="96" y1="375.4" x2="776" y2="375.4" stroke="#1A1A1A" stroke-width="1.3"/><line x1="96.0" y1="424.2" x2="776.0" y2="134.1" stroke="#5A6560" stroke-width="2.6" stroke-dasharray="6 4"/><circle cx="210.5" cy="375.4" r="4.4" fill="#5A6560"/><line x1="96.0" y1="424.2" x2="776.0" y2="193.2" stroke="#14432E" stroke-width="2.6"/><circle cx="239.8" cy="375.4" r="4.4" fill="#14432E"/><line x1="96.0" y1="424.2" x2="776.0" y2="355.9" stroke="#8A5A00" stroke-width="2.6"/><circle cx="581.7" cy="375.4" r="4.4" fill="#8A5A00"/><text x="244.8" y="405.4" font-size="9.6" font-weight="700" fill="#14432E">14,800</text><text x="581.7" y="405.4" font-size="9.6" font-weight="700" fill="#8A5A00" text-anchor="middle">50,000</text><line x1="246" y1="134.5" x2="270" y2="134.5" stroke="#5A6560" stroke-width="2.6" stroke-dasharray="6 4"/><text x="276" y="138" font-size="9.4" fill="#1A1A1A">Error cost ignored &#8212; 12.56 a record; breakeven 11,783</text><line x1="246" y1="149.5" x2="270" y2="149.5" stroke="#14432E" stroke-width="2.6"/><text x="276" y="153" font-size="9.4" fill="#1A1A1A">USD 320 an undetected error &#8212; 10.00; breakeven 14,800</text><line x1="246" y1="164.5" x2="270" y2="164.5" stroke="#8A5A00" stroke-width="2.6"/><text x="276" y="168" font-size="9.4" fill="#1A1A1A">USD 1,200 an undetected error &#8212; 2.96; breakeven 50,000</text><line x1="187.3" y1="110" x2="187.3" y2="448" stroke="#1A1A1A" stroke-width="1.1" stroke-dasharray="3 4" opacity="0.75"/><text x="193.3" y="104" font-size="10.0" font-weight="700" fill="#1A1A1A" text-anchor="start">Kestrel alone &#183; 9,400</text><line x1="643.9" y1="110" x2="643.9" y2="448" stroke="#1A1A1A" stroke-width="1.1" stroke-dasharray="3 4" opacity="0.75"/><text x="637.9" y="104" font-size="10.0" font-weight="700" fill="#1A1A1A" text-anchor="end">Six-asset portfolio &#183; 56,400</text><circle cx="187.3" cy="393.2" r="4.4" fill="#14432E"/><text x="179.3" y="383.2" font-size="9.6" font-weight="700" fill="#14432E" text-anchor="end">&#8722;54,000</text><circle cx="643.9" cy="238.1" r="4.4" fill="#14432E"/><text x="635.9" y="230.1" font-size="9.8" font-weight="700" fill="#14432E" text-anchor="end">+416,000</text><circle cx="643.9" cy="369.1" r="4.4" fill="#8A5A00"/><text x="651.9" y="362.1" font-size="9.6" font-weight="700" fill="#8A5A00" text-anchor="end">+18,944</text><line x1="96" y1="448" x2="776" y2="448" stroke="#1A1A1A" stroke-width="1.2"/><line x1="96" y1="118" x2="96" y2="448" stroke="#1A1A1A" stroke-width="1.2"/><text x="436.0" y="482" font-size="12" fill="#5A6560" text-anchor="middle">Records reviewed a year</text><text x="44" y="283.0" font-size="12" fill="#5A6560" text-anchor="middle" transform="rotate(-90 44 283.0)">Net annual saving (USD)</text></svg>