utput</text><text x="704.3" y="170.1" font-size="10.6" font-weight="700" fill="#0F172A">12,255,674</text><rect x="258.0" y="243.2" width="171.3" height="39.7" fill="#1D4ED8" opacity="0.92"/><text x="266.0" y="268.3" font-size="9.4" fill="white" font-weight="600">delay cap 4,800,000</text><rect x="429.3" y="243.2" width="171.3" height="39.7" fill="#1D4ED8" opacity="0.55"/><text x="437.3" y="268.3" font-size="9.4" fill="white" font-weight="600">performance cap 4,800,000</text><line x1="600.5" y1="240.2" x2="600.5" y2="286.0" stroke="#0F172A" stroke-width="1.2"/><text x="244" y="261.5" font-size="11" fill="#0F172A" text-anchor="end" font-weight="700">Nominal contractual cover</text><text x="244" y="274.5" font-size="9.2" fill="#64748B" text-anchor="end">the caps as drafted &#8212; 20 % aggregate</text><text x="609.5" y="269.5" font-size="10.6" font-weight="700" fill="#0F172A">9,600,000</text><rect x="258.0" y="342.6" width="171.3" height="39.7" fill="#1D4ED8" opacity="0.92"/><text x="266.0" y="367.6" font-size="9.4" fill="white" font-weight="600">on-demand bond 4,800,000</text><rect x="429.3" y="342.6" width="119.9" height="39.7" fill="#64748B" opacity="0.75"/><text x="437.3" y="367.6" font-size="9.4" fill="white" font-weight="600">guarantee 3,360,000</text><line x1="549.1" y1="339.6" x2="549.1" y2="385.3" stroke="#0F172A" stroke-width="1.2"/><text x="244" y="360.8" font-size="11" fill="#0F172A" text-anchor="end" font-weight="700">Risk-adjusted cover</text><text x="244" y="373.8" font-size="9.2" fill="#64748B" text-anchor="end">bond at 1.00 &#183; parent guarantee at 0.70</text><text x="558.1" y="368.8" font-size="10.6" font-weight="700" fill="#0F172A">8,160,000</text><line x1="600.5" y1="298.0" x2="695.3" y2="298.0" stroke="#0F172A" stroke-width="1.4"/><line x1="600.5" y1="294.0" x2="600.5" y2="302.0" stroke="#0F172A" stroke-width="1.4"/><line x1="695.3" y1="294.0" x2="695.3" y2="302.0" stroke="#0F172A" stroke-width="1.4"/><text x="647.9" y="313.0" font-size="9.8" fon