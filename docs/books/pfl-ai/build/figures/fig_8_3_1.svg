<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="720" height="430" fill="white"/><line x1="250.0" y1="78" x2="250.0" y2="374" stroke="#E2E8F0"/><text x="250.0" y="390" font-size="10" fill="#64748B" text-anchor="middle">0m</text><line x1="306.3" y1="78" x2="306.3" y2="374" stroke="#E2E8F0"/><text x="306.3" y="390" font-size="10" fill="#64748B" text-anchor="middle">2m</text><line x1="362.7" y1="78" x2="362.7" y2="374" stroke="#E2E8F0"/><text x="362.7" y="390" font-size="10" fill="#64748B" text-anchor="middle">3m</text><line x1="419.0" y1="78" x2="419.0" y2="374" stroke="#E2E8F0"/><text x="419.0" y="390" font-size="10" fill="#64748B" text-anchor="middle">4m</text><line x1="475.3" y1="78" x2="475.3" y2="374" stroke="#E2E8F0"/><text x="475.3" y="390" font-size="10" fill="#64748B" text-anchor="middle">6m</text><line x1="531.7" y1="78" x2="531.7" y2="374" stroke="#E2E8F0"/><text x="531.7" y="390" font-size="10" fill="#64748B" text-anchor="middle">8m</text><line x1="588.0" y1="78" x2="588.0" y2="374" stroke="#E2E8F0"/><text x="588.0" y="390" font-size="10" fill="#64748B" text-anchor="middle">9m</text><rect x="250" y="87.9" width="319.2" height="22.7" fill="#64748B" opacity="0.42"/><text x="240" y="101.9" font-size="10.4" fill="#0F172A" text-anchor="end" font-weight="600">Worst-case sum of threats</text><text x="240" y="114.9" font-size="9.4" fill="#64748B" text-anchor="end">funds nothing anyone will approve</text><text x="577.2" y="101.9" font-size="10.4" font-weight="700" fill="#0F172A">8,500,000</text><text x="577.2" y="114.9" font-size="9.4" fill="#64748B">17.71 %</text><rect x="250" y="137.2" width="244.6" height="22.7" fill="#64748B" opacity="0.42"/><text x="240" y="151.3" font-size="10.4" fill="#0F172A" text-anchor="end" font-weight="600">Range P80 (Stage C, unwrapped)</text><text x="240" y="164.3" font-size="9.4" fill="#64748B" text-anchor="end">estimate uncertainty, no wrap</text><text x="502.6" y="151.3" font-size="10.4" font-weight="700" fill="#0F172A">6,512,795</text><text x="502.6" y="164.3" font-size="9.4" fill="#64748B">13.57 %</text><rect x="250" y="186.5" width="180.3" height="22.7" fill="#C13329" opacity="0.95"/><text x="240" y="200.6" font-size="10.4" fill="#0F172A" text-anchor="end" font-weight="600">Ten per cent of base &#8212; the rule</text><text x="240" y="213.6" font-size="9.4" fill="#64748B" text-anchor="end">P87.3 on the register, P70.4 on the range</text><text x="438.3" y="200.6" font-size="10.4" font-weight="700" fill="#C13329">4,800,000</text><text x="438.3" y="213.6" font-size="9.4" fill="#64748B">10.00 %</text><rect x="250" y="235.9" width="159.5" height="22.7" fill="#1D4ED8" opacity="0.95"/><text x="240" y="249.9" font-size="10.4" fill="#0F172A" text-anchor="end" font-weight="600">Register P80 (wrapped scope)</text><text x="240" y="262.9" font-size="9.4" fill="#64748B" text-anchor="end">the defensible provision here</text><text x="417.5" y="249.9" font-size="10.4" font-weight="700" fill="#1D4ED8">4,246,095</text><text x="417.5" y="262.9" font-size="9.4" fill="#64748B">8.85 %</text><rect x="250" y="285.2" width="136.9" height="22.7" fill="#C13329" opacity="0.95"/><text x="240" y="299.3" font-size="10.4" fill="#0F172A" text-anchor="end" font-weight="600">Funded balancing line (D6)</text><text x="240" y="312.3" font-size="9.4" fill="#64748B" text-anchor="end">a P69.7 provision &#8212; 600,692 short</text><text x="394.9" y="299.3" font-size="10.4" font-weight="700" fill="#C13329">3,645,403</text><text x="394.9" y="312.3" font-size="9.4" fill="#64748B">7.59 %</text><rect x="250" y="334.5" width="101.0" height="22.7" fill="#64748B" opacity="0.42"/><text x="240" y="348.6" font-size="10.4" fill="#0F172A" text-anchor="end" font-weight="600">Register mean, &#931; EMV</text><text x="240" y="361.6" font-size="9.4" fill="#64748B" text-anchor="end">funds the average, exceeded half the time</text><text x="359.0" y="348.6" font-size="10.4" font-weight="700" fill="#0F172A">2,690,000</text><text x="359.0" y="361.6" font-size="9.4" fill="#64748B">5.60 %</text><line x1="250" y1="374" x2="588" y2="374" stroke="#0F172A" stroke-width="1.2"/><line x1="250" y1="78" x2="250" y2="374" stroke="#0F172A" stroke-width="1.2"/><text x="419.0" y="408" font-size="12" fill="#64748B" text-anchor="middle">Contingency on a 48,000,000 base estimate (USD)</text><text x="198" y="226.0" font-size="12" fill="#64748B" text-anchor="middle" transform="rotate(-90 198 226.0)"></text><text x="24" y="26" font-size="12.5" font-weight="700" fill="#0F172A">Six methods, one question &#8212; and a 3.16&#215; spread between the answers</text><text x="24" y="44" font-size="10.4" fill="#64748B">Crimson: the two numbers that do not state a confidence level. Blue: the provision the register supports at P80 under a fixed-price wrap</text><text x="24" y="59" font-size="10.4" fill="#C13329">The rule of thumb buys P87.3 against the risk register and P70.4 against the estimate range &#8212; the same 4,800,000, two different promises</text><text x="419.0" y="414" font-size="11.2" font-weight="600" fill="#0F172A" text-anchor="middle">A contingency percentage is meaningless without the estimate class and the basis it was sized on</text></svg>