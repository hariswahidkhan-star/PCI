<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="color-scheme" content="light only"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>PCI · Admin Dashboard</title>
<style>
:root{
  --navy:#0E1525; --navy-2:#131c30; --blue:#1D4ED8; --blue-700:#1E3A8A; --blue-50:#eef3fe;
  --ink:#0F172A; --slate:#475569; --mist:#64748B; --line:#E3E8EF; --line-2:#eef1f5;
  --bg:#f4f6f9; --card:#ffffff; --ok:#1a7d3c; --ok-50:#eaf6ee; --warn:#B45309; --warn-50:#fdf4e7;
  --err:#C2410C; --err-50:#fdefe8; --muted:#94a3b8;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,'Times New Roman',serif;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;border:2px solid var(--bg)}

#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#eaf1fe 0%,#f6f9ff 55%,#eef6ff 100%);padding:20px;z-index:50}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:18px;box-shadow:0 24px 70px rgba(29,78,216,.16);border:1px solid #e3e9f4;overflow:hidden}
.login-head{background:linear-gradient(135deg,#1D4ED8,#3B82F6);padding:30px 34px 26px}
.login-head .wm{font-family:var(--serif);font-weight:700;font-size:26px;color:#fff;letter-spacing:1px}
.login-head .sub{margin-top:7px;font-size:10px;letter-spacing:3.5px;text-transform:uppercase;color:#dbe6ff;font-weight:600}
.login-body{padding:28px 34px 30px}
.login-body h1{font-family:var(--serif);font-size:20px;margin:0 0 4px;color:var(--ink)}
.login-body p.hint{margin:0 0 20px;color:var(--mist);font-size:13px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--slate);margin-bottom:6px}
.fld input{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:11px 13px;font-size:14px;font-family:inherit}
.fld input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
.login-body .btn-primary{width:100%;justify-content:center;margin-top:6px}
.login-alt{margin-top:16px;text-align:center;font-size:13px;color:var(--mist)}
.login-alt button{background:none;border:none;color:var(--blue);font-weight:600;font-size:13px;text-decoration:underline}
.login-err{background:var(--err-50);color:var(--err);border:1px solid #f6d3c2;border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;display:none}

#app{display:none;min-height:100vh}
.layout{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
.rail{background:#ffffff;color:var(--slate);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.rail-top{padding:22px 22px 18px;border-bottom:1px solid var(--line-2)}
.rail-top .wm{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--blue);letter-spacing:.8px}
.rail-top .sub{margin-top:6px;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--mist);font-weight:600}
.nav{padding:12px;flex:1;overflow-y:auto}
.nav-group{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#9aa6b8;font-weight:700;padding:14px 12px 7px}
.nav-group{margin:16px 12px 6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5B6B85}
.nav-group.app{color:#fff;background:linear-gradient(90deg,rgba(29,78,216,.28),transparent);border-left:3px solid #3B82F6;padding:7px 9px;border-radius:6px;margin-top:20px;letter-spacing:.04em;font-size:11.5px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--slate);font-size:13.5px;font-weight:500;margin-bottom:2px;transition:background .12s,color .12s}
.nav a .ico{width:17px;height:17px;flex:0 0 auto;opacity:.85}
.nav a:hover{background:#eef3fe;color:var(--ink)}
.nav a.active{background:var(--blue);color:#fff}
.nav a .badge{margin-left:auto;background:var(--blue-50);color:var(--blue-700);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px}
.nav a.active .badge{background:rgba(255,255,255,.25)}
.rail-foot{padding:14px 18px;border-top:1px solid var(--line-2);font-size:11px;color:var(--mist)}
.rail-foot button{background:none;border:1px solid var(--line);color:var(--slate);border-radius:8px;padding:7px 12px;font-size:12px;width:100%;margin-top:8px}
.rail-foot button:hover{background:#eef3fe;color:var(--ink)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:0 26px;height:62px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
.topbar h2{font-family:var(--serif);font-size:19px;margin:0;font-weight:700;color:var(--ink)}
.topbar .crumb{color:var(--mist);font-size:12.5px}
.topbar .spacer{flex:1}
.search{position:relative}
.search input{border:1.5px solid var(--line);border-radius:9px;padding:9px 12px 9px 34px;font-size:13px;width:260px;font-family:inherit}
.search input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mist)}
.env-pill{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;padding:6px 11px;border-radius:20px;letter-spacing:.3px}
.env-live{background:var(--ok-50);color:var(--ok)}
.env-sample{background:var(--warn-50);color:var(--warn)}
.env-pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.content{padding:26px;max-width:1320px;width:100%}
.sample-banner{background:var(--warn-50);border:1px solid #f4dcb0;color:#8a5a12;border-radius:11px;padding:11px 16px;font-size:12.5px;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.sample-banner strong{color:var(--warn)}
.sample-banner svg{width:16px;height:16px;flex:0 0 auto;color:var(--warn)}

.btn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600}
.btn:hover{border-color:#cfd6e0;background:#fafbfc}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:#1a45c2;border-color:#1a45c2}
.btn-ghost{border-color:transparent;background:transparent;color:var(--slate)}
.btn-ghost:hover{background:#f1f4f8}
.btn-danger{color:var(--err);border-color:#f2cdbb}.btn-danger:hover{background:var(--err-50)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;text-transform:capitalize}
.b-green{background:var(--ok-50);color:var(--ok)} .b-amber{background:var(--warn-50);color:var(--warn)}
.b-red{background:var(--err-50);color:var(--err)} .b-blue{background:var(--blue-50);color:var(--blue-700)}
.b-grey{background:#eef1f5;color:var(--slate)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11.5px;color:var(--mist);font-weight:600;text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:7px}
.kpi .lab .ic{width:15px;height:15px;color:var(--blue)}
.kpi .val{font-size:27px;font-weight:800;color:var(--ink);margin-top:9px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi .val small{font-size:14px;font-weight:600;color:var(--mist)}
.kpi .sub{font-size:12px;color:var(--slate);margin-top:4px}
.kpi .sub b.up{color:var(--ok)} .kpi .sub b.down{color:var(--err)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:20px}
.panel-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.panel-h h3{font-family:var(--serif);font-size:16px;margin:0;font-weight:700}
.panel-h .spacer{flex:1}
.panel-b{padding:20px}
.grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
.grid-2>.panel{margin-bottom:0}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .spacer{flex:1}
select.filter{border:1.5px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)}
select.filter:focus{outline:none;border-color:var(--blue)}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mist);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line);background:#fbfcfd;white-space:nowrap}
tbody td{padding:13px 16px;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.clickable{cursor:pointer}tbody tr.clickable:hover{background:#f7f9fc}
td .em{color:var(--mist);font-size:12px}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.actions{text-align:right;white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--blue-50);color:var(--blue-700);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;margin-right:9px;flex:0 0 auto}
.cellflex{display:flex;align-items:center}
.empty{padding:56px 20px;text-align:center;color:var(--mist)}
.empty svg{width:40px;height:40px;opacity:.4;margin-bottom:12px}
.empty h4{margin:0 0 4px;color:var(--slate);font-size:15px;font-weight:700}
.tfoot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--mist)}
.chart-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;justify-content:center}
.chart-legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--slate)}
.chart-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.funnel-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.funnel-row .fl{width:96px;font-size:12.5px;color:var(--slate);font-weight:600}
.funnel-bar{flex:1;height:30px;background:#eef1f5;border-radius:7px;overflow:hidden;position:relative}
.funnel-bar i{display:block;height:100%;background:linear-gradient(90deg,#3B82F6,#1D4ED8);border-radius:7px}
.funnel-bar b{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink);font-weight:700}
.activity{list-style:none;margin:0;padding:0}
.activity li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.activity li:last-child{border:none}
.activity .adot{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:5px;flex:0 0 auto}
.activity .atxt{font-size:13px;color:var(--ink)}
.activity .atime{font-size:11.5px;color:var(--mist);margin-top:1px}

.scrim{position:fixed;inset:0;background:rgba(15,23,42,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:520px;max-width:94vw;background:#fff;box-shadow:-20px 0 60px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);z-index:41;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-h{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.drawer-h h3{font-family:var(--serif);font-size:18px;margin:0 0 3px}
.drawer-h .x{margin-left:auto;background:none;border:none;font-size:22px;color:var(--mist);line-height:1;padding:2px 6px}
.drawer-h .x:hover{color:var(--ink)}
.drawer-b{padding:22px 24px;overflow-y:auto;flex:1}
.dsection{margin-bottom:24px}
.dsection h5{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mist);font-weight:700;margin:0 0 11px;padding-bottom:7px;border-bottom:1px solid var(--line-2)}
.drow{display:flex;justify-content:space-between;gap:16px;padding:7px 0;font-size:13.5px}
.drow .k{color:var(--mist)} .drow .v{color:var(--ink);font-weight:600;text-align:right}
.dactions{display:flex;flex-wrap:wrap;gap:8px;padding:16px 24px;border-top:1px solid var(--line);background:#fafbfc}
.minitable{width:100%;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.minitable td{padding:9px 12px;font-size:12.5px;border-bottom:1px solid var(--line-2)}
.minitable tr:last-child td{border:none}
.minitable td.num{text-align:right}

.modal-scrim{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal-scrim.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:460px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
.modal-h{padding:20px 24px 16px;border-bottom:1px solid var(--line)}
.modal-h h3{font-family:var(--serif);margin:0;font-size:18px}
.modal-b{padding:20px 24px}
.modal-f{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;background:#fafbfc}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12px;font-weight:600;color:var(--slate);margin-bottom:6px}
.form-row input,.form-row select,.form-row textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;font-family:inherit}
.form-row textarea{resize:vertical;line-height:1.5}
.form-row input:focus,.form-row select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
.form-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#toasts{position:fixed;bottom:22px;right:22px;z-index:80;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--blue);color:#fff;padding:12px 16px;border-radius:11px;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;animation:tin .2s ease}
.toast.ok{background:#1a7d3c}.toast.err{background:#C2410C}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.inline-note{font-size:12px;color:var(--mist);background:#f8f9fb;border:1px solid var(--line-2);border-radius:9px;padding:11px 13px;line-height:1.55}
.edit-input{border:1.5px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px;width:90px;font-family:inherit}
.pct-cell{display:flex;align-items:center;gap:8px}
.pbar{width:70px;height:6px;background:#eef1f5;border-radius:4px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--blue)}
.menu-btn{display:none}
@media(max-width:1080px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
@media(max-width:820px){.layout{grid-template-columns:1fr}.rail{position:fixed;left:-260px;transition:left .2s;z-index:45;width:244px}.rail.open{left:0;box-shadow:0 10px 40px rgba(15,23,42,.18)}.menu-btn{display:inline-flex!important}.search input{width:150px}}

/* ===== student-360 panel tabs ===== */
.stutabs{display:flex;gap:4px;flex-wrap:wrap;position:sticky;top:0;background:#fff;padding-bottom:12px;margin-bottom:4px;border-bottom:1px solid var(--line);z-index:2}
.stutab{background:#F1F4F8;border:1px solid transparent;color:#475569;font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:9px;cursor:pointer;transition:.13s}
.stutab:hover{background:#E7ECF3}
.stutab.on{background:var(--brand,#1D4ED8);color:#fff}
.drawer.wide{width:720px}
.stupane .minitable{width:100%;font-size:12.5px}
.stupane .minitable th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:#94A3B8;font-weight:700;padding:4px 8px 4px 0}
.stupane .minitable td{padding:6px 8px 6px 0;border-top:1px solid #EFF2F7;vertical-align:top}

/* ===== settings: toggle switch + rows ===== */
.setrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;border-top:1px solid #EFF2F7}
.setrow:first-child{border-top:0}
.setrow .sk{font-weight:600;font-size:14px}
.setrow .sd{font-size:12px;color:#64748B;margin-top:2px;max-width:520px;line-height:1.5}
.setrow .sv{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.swch{position:relative;width:44px;height:25px;flex:0 0 auto;cursor:pointer}
.swch input{opacity:0;width:0;height:0;position:absolute}
.swch .track{position:absolute;inset:0;background:#CBD5E1;border-radius:20px;transition:.18s}
.swch .knob{position:absolute;top:3px;left:3px;width:19px;height:19px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.swch input:checked+.track{background:var(--brand,#1D4ED8)}
.swch input:checked+.track+.knob{transform:translateX(19px)}
.setinput{width:120px;padding:8px 10px;border:1px solid var(--line,#E7EBF1);border-radius:9px;font-family:inherit;font-size:13.5px;text-align:right}
.setinput.wide{width:280px;text-align:left}
.setsel{padding:8px 10px;border:1px solid var(--line,#E7EBF1);border-radius:9px;font-family:inherit;font-size:13.5px}
.setbar{position:sticky;bottom:0;background:linear-gradient(0deg,#fff 70%,transparent);padding:16px 0 4px;display:flex;gap:10px;align-items:center;margin-top:8px}
.setbar .dirty{font-size:12.5px;color:#92580A}

/* ===== team & access ===== */
.permwrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:6px}
.permgroup{border:1px solid var(--line,#E7EBF1);border-radius:12px;padding:12px 14px;background:#FAFBFD}
.permgroup h6{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#64748B;font-weight:800;margin:0 0 8px}
.permrow{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0;color:#0F172A}
.permrow input{accent-color:var(--brand,#1D4ED8);width:15px;height:15px;flex:0 0 auto}
.permrow.dis{opacity:.55}
.teamform .lab{display:block;margin:12px 0 5px}
.temp-pw{font-family:ui-monospace,Consolas,monospace;font-size:17px;font-weight:700;letter-spacing:.06em;background:#F1F5FF;border:1px dashed #B9CBF3;border-radius:10px;padding:12px 16px;text-align:center;margin:10px 0}
.accesschips{display:flex;gap:4px;flex-wrap:wrap}
.accesschips .badge{font-size:10px}

/* ===== team & access: role badges ===== */
.rolebadge{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:20px;padding:3px 10px;display:inline-block}
.r-owner{background:#FEE2E2;color:#B91C1C}
.r-mgr{background:#DBEAFE;color:#1D4ED8}
.r-custom{background:#FEF3C7;color:#92580A}
.r-viewer{background:#F1F4F8;color:#64748B}
@media (prefers-reduced-motion: reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="login">
  <div class="login-card">
    <div class="login-head"><div class="wm">PCI</div><div class="sub">Project Controls Institute</div></div>
    <div class="login-body">
      <h1>Admin dashboard</h1>
      <p class="hint">Connect to your PCI backend to manage members, enrolments, payments, credentials and more.</p>
      <div class="login-err" id="loginErr"></div>
      <div class="fld"><label>Backend URL</label><input id="inApi" placeholder="https://api.yourdomain.com" autocomplete="off" aria-label="https://api.yourdomain.com"/></div>
      <div id="loginAcct">

const _mem={};
const store={ get:k=>{try{return sessionStorage.getItem(k)}catch(e){return _mem[k]??null}},
  set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){_mem[k]=v}}, del:k=>{try{sessionStorage.removeItem(k)}catch(e){delete _mem[k]}} };
const state={ apiBase:store.get('pci_api')||'', token:store.get('pci_tok')||'', mode:store.get('pci_mode')||null, authMode:store.get('pci_authmode')||null, me:null, perms:null, route:'overview', q:'', filters:{} };
const $=(s,r=document)=>r.querySelector(s);
const money=n=>{ n=Number(n||0); return 'USD '+(Number.isInteger(n)?n.toLocaleString('en-US'):n.toFixed(2)); };
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=(f,l)=>(((f||'?')[0]||'')+((l||'')[0]||'')).toUpperCase();
function fmtDate(s){ if(!s)return'—'; const d=new Date(String(s).replace(' ','T')); if(isNaN(d))return esc(s); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDT(s){ if(!s)return'—'; const d=new Date(String(s).replace(' ','T')); if(isNaN(d))return esc(s); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function ago(s){ if(!s)return'—'; const d=new Date(String(s).replace(' ','T')); const m=Math.floor((Date.now()-d)/60000); if(isNaN(m))return esc(s); if(m<1)return'just now'; if(m<60)return m+'m ago'; const h=Math.floor(m/60); if(h<24)return h+'h ago'; return Math.floor(h/24)+'d ago'; }
function toast(msg,kind){ const t=document.createElement('div'); t.className='toast '+(kind||''); t.textContent=msg; $('#toasts').appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},2600); }
const BADGE={ active:'b-green',paid:'b-green',closed:'b-grey',new:'b-blue',in_progress:'b-amber',pending:'b-amber',abandoned:'b-red',failed:'b-red',refunded:'b-amber',revoked:'b-red',expired:'b-grey',deactivated:'b-grey',inactive:'b-grey' };

/* The backend accepts admin session Bearer tokens only (the legacy x-admin-token was removed

const authHeaders=()=>({'Authorization':'Bearer '+state.token});
async function apiBlob(path){
  const r=await fetch(state.apiBase.replace(/\/$/,'')+path,{headers:authHeaders()}); // was state.api (undefined) — broke every evidence/attachment view in live mode
  if(!r.ok)throw new Error('http_'+r.status);
  return URL.createObjectURL(await r.blob());
}
async function openBlob(path){try{const url=await apiBlob(path);const w=window.open();if(w)w.document.write('<iframe src="'+url+'" style="width:100%;height:100vh;border:0"></iframe>');else location.href=url;}catch(_){toast('Could not open evidence','err');}}
async function api(path,opts={}){
  if(state.mode==='sample') return sampleAPI(path,opts);
  const r=await fetch(state.apiBase.replace(/\/$/,'')+path,{...opts,headers:{...authHeaders(),'Content-Type':'application/json',...(opts.headers||{})}});
  if(r.status===401){ signOut(); throw new Error('unauthorized'); }
  if(!r.ok){ let code='http_'+r.status; try{ const d=await r.json(); if(d&&d.error) code=d.error; }catch(_){ } throw new Error(code); }
  const ct=r.headers.get('content-type')||''; return ct.includes('json')?r.json():r.text();
}

const sico=(n,cls)=>`<svg class="${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||''}</svg>`;

let counts={};
function canSee(id){
  // sample mode or shared-token with no /me → see everything; else check perms
  if(state.mode==='sample') return true;
  if(state.me&&state.me.is_owner) return true;
  if(!state.perms) return true;
  const sec=SECTIONS.find(s=>s.id===id);
  return state.perms.includes((sec&&sec.perm)||id);   // a section may map to another permission (certifications → exams)
}
function buildNav(){
  const nav=$('#nav'); nav.innerHTML='';
  // build groups, dropping any whose items are all hidden
  let i=0;
  while(i<SECTIONS.length){
    const sec=SECTIONS[i];
    if(sec.g){
      const items=[]; let j=i+1;
      while(j<SECTIONS.length && !SECTIONS[j].g){ if(canSee(SECTIONS[j].id)) items.push(SECTIONS[j]); j++; }
      if(items.length){
        const d=document.createElement('div'); d.className='nav-group'+(/[①②③]/.test(sec.g)?' app':''); d.textContent=sec.g; nav.appendChild(d);
        items.forEach(s=>{ const a=document.createElement('a'); a.href='#'+s.id; a.dataset.id=s.id;
          const bd=s.badge&&counts[s.badge]?`<span class="badge">${counts[s.badge]}</span>`:'';
          a.innerHTML=sico(s.icon,'ico')+'<span>'+s.label+'</span>'+bd;
          a.onclick=e=>{e.preventDefault();navigate(s.id);$('#rail').classList.remove('open');};
          nav.appendChild(a); });
      }
      i=j;
    } else i++;
  }
  setActive();
}
function setActive(){ document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===state.route)); }

async function navigate(id){
  const sec=SECTIONS.find(s=>s.id===id); if(!sec)return;
  if(!canSee(id)){ $('#view').innerHTML='<div class="empty"><h4>No access</h4><p>Your role doesn’t include this section. Ask an owner to grant access under Team &amp; Access.</p></div>'; $('#pageTitle').textContent='Restricted'; return; }
  state.route=id; state.q=''; state.filters={}; setActive();
  $('#pageTitle').textContent=sec.label;
  const searchable=['members','enrollments','payments','credentials','inquiries','emails','pages'].includes(id);
  $('#searchWrap').style.display=searchable?'block':'none';
  if(searchable){ $('#searchInput').value=''; $('#searchInput').placeholder='Search '+sec.label.toLowerCase()+'…'; }
  $('#view').innerHTML='<div class="empty">Loading…</div>';
  try{ await sec.render(); }catch(e){ $('#view').innerHTML=`<div class="empty"><h4>Couldn’t load ${esc(sec.label)}</h4><p>${esc(e.message)}</p></div>`; }
}
$('#searchInput').addEventListener('input',e=>{ state.q=e.target.value; const sec=SECTIONS.find(s=>s.id===state.route); clearTimeout(window._st); window._st=setTimeout(()=>sec.render(),260); });
window.addEventListener('hashchange',()=>{ const id=location.hash.slice(1); if(id&&SECTIONS.find(s=>s.id===id)&&id!==state.route) navigate(id); });

function qs(o){ const p=Object.entries(o).filter(([,v])=>v!=null&&v!=='').map(([k,v])=>k+'='+encodeURIComponent(v)); return p.length?'?'+p.join('&'):''; }
function toolbar(filters){
  let h='<div class="toolbar">';
  filters.forEach(f=>{ h+=`<select class="filter" data-f="${f.id}"><option value="">${f.label}</option>`+f.options.map(o=>`<option value="${o[0]}"${state.filters[f.id]===o[0]?' selected':''}>${o[1]}</option>`).join('')+'</select>'; });
  h+='<div class="spacer"></div><button class="btn btn-sm" data-refresh>'+sico('flow')+' Refresh</button></div>'; return h;
}
function wireToolbar(rerender){
  document.querySelectorAll('.toolbar .filter').forEach(sel=>sel.onchange=()=>{ state.filters[sel.dataset.f]=sel.value; rerender(); });
  const rb=document.querySelector('[data-refresh]'); if(rb) rb.onclick=rerender;
}
function tableShell(cols,body,foot){ return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th${c.num?' style="text-align:right"':''}>${c.t}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>${foot||''}</div>`; }
function emptyRow(n,msg){ return `<tr><td colspan="${n}"><div class="empty">${sico('grid')}<h4>Nothing here yet</h4><p>${esc(msg||'Records will appear here once activity begins.')}</p></div></td></tr>`; }
function kvrows(o){ return o.map(([k,v])=>`<div class="drow"><span class="k">${k}</span><span class="v">${v}</span></div>`).join(''); }

/* ---------- OVERVIEW ---------- */
async function renderOverview(){
  const d=await api('/api/admin/overview'); const k=d.kpis;
  const kpi=(lab,val,sub,ic)=>`<div class="kpi"><div class="lab">${sico(ic,'ic')} ${lab}</div><div class="val">${val}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
  const cards=[
    kpi('Members',k.members,`<b class="up">${k.activeMembers}</b> active · ${k.pendingMembers} pending`,'users'),
    kpi('Revenue',money(k.revenue),`${money(k.revenueMonth)} this month`,'money'),
    kpi('Payments',k.payCount,`${k.refunded} refunded · ${k.failedPay} failed`,'card'),
    kpi('In progress',k.inProgress,`${k.abandoned} abandoned (72h+)`,'flow'),
    kpi('Credentials',k.credActive+' <small>active</small>',`${k.credTotal} issued in total`,'award'),
    kpi('Exams to schedule',k.examsDue,'within the 12-month window','clipboard'),
    kpi('Open enquiries',k.openInq,'awaiting response','mail'),
    kpi('Paid enrolments',k.paidSessions,'completed checkout','grid'),
  ].join('');
  const rev=d.revSeries||[];
  const revChart=rev.length?barSVG(rev.map(r=>({label:r.ym,short:(r.ym||'').slice(5),value:r.amount}))):`<div class="empty" style="padding:30px">${sico('money')}<p>No paid revenue yet.</p></div>`;
  const mix=d.productMix||[]; const mixTotal=mix.reduce((s,m)=>s+m.n,0);
  const mc={membership:'#1D4ED8',exam:'#3B82F6',bundle:'#1E3A8A',renewal:'#60A5FA',retake:'#93C5FD'};
  const donutHtml=mixTotal?donutSVG(mix.map(m=>({label:PRODUCT[m.product_type]||m.product_type,value:m.n,color:mc[m.product_type]||'#94a3b8'}))):`<div class="empty" style="padding:30px">${sico('grid')}<p>No product data yet.</p></div>`;
  const f=d.funnel||{started:0,in_progress:0,paid:0}; const fmax=Math.max(1,f.started);
  const funnel=[['Started',f.started],['In progress',f.in_progress],['Paid',f.paid]].map(([l,v])=>`<div class="funnel-row"><div class="fl">${l}</div><div class="funnel-bar"><i style="width:${Math.round(v/fmax*100)}%"></i><b>${v}</b></div></div>`).join('');
  const act=d.recent||[];
  const actHtml=act.length?'<ul class="activity">'+act.map(a=>`<li><span class="adot"></span><div><div class="atxt">${esc((a.action||'').replace(/_/g,' '))}${a.details?` <span class="em">— ${esc(a.details)}</span>`:''}</div><div class="atime">${ago(a.ts)}</div></div></li>`).join('')+'</ul>':`<div class="empty" style="padding:24px">${sico('shield')}<p>No recent activity.</p></div>`;
  $('#view').innerHTML=`
    <div class="kpi-grid">${cards}</div>
    <div class="grid-2">
      <div class="panel"><div class="panel-h"><h3>Revenue — last 12 months</h3><div class="spacer"></div><span class="badge b-blue">${money(k.revenue)} total</span></div><div class="panel-b">${revChart}</div></div>
      <div class="panel"><div class="panel-h"><h3>Product mix</h3></div><div class="panel-b" style="text-align:center">${donutHtml}</div></div>
    </div>
    <div class="grid-2" style="margin-top:20px">
      <div class="panel"><div class="panel-h"><h3>Recent activity</h3></div><div class="panel-b">${actHtml}</div></div>
      <div class="panel"><div class="panel-h"><h3>Enrolment funnel</h3></div><div class="panel-b">${funnel}<div class="inline-note" style="margin-top:8px">Conversion (paid ÷ started): <b>${f.started?Math.round(f.paid/f.started*100):0}%</b></div></div></div>
    </div>`;
}
function barSVG(series){
  const w=560,h=190,pad=30,max=Math.max(1,...series.map(s=>s.value)),gap=(w-pad*2)/series.length,bw=Math.min(38,gap*0.6); let g='';
  [0.25,0.5,0.75,1].forEach(t=>{ const y=h-pad-(h-pad*2)*t; g+=`<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="#eef1f5"/><text x="${pad-6}" y="${y+3}" text-anchor="end" font-size="8.5" fill="#94a3b8">${Math.round(max*t)}</text>`; });
  series.forEach((s,i)=>{ const bh=(s.value/max)*(h-pad*2),x=pad+i*gap+(gap-bw)/2,y=h-pad-bh; g+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1,bh)}" rx="3" fill="#1D4ED8"><title>${esc(s.label)}: ${money(s.value)}</title></rect><text x="${x+bw/2}" y="${h-11}" text-anchor="middle" font-size="8.5" fill="#94a3b8">${esc(s.short||s.label)}</text>`; });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">${g}</svg>`;
}
function donutSVG(segs){
  const tot=segs.reduce((s,x)=>s+x.value,0)||1; const R=54,r=34,cx=70,cy=70; let a=-Math.PI/2,paths='';
  segs.forEach(s=>{ const fr=s.value/tot,a2=a+fr*2*Math.PI,x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2),xi2=cx+r*Math.cos(a2),yi2=cy+r*Math.sin(a2),xi1=cx+r*Math.cos(a),yi1=cy+r*Math.sin(a),lg=fr>0.5?1:0;
    paths+=`<path d="M${x1} ${y1} A${R} ${R} 0 ${lg} 1 ${x2} ${y2} L${xi2} ${yi2} A${r} ${r} 0 ${lg} 0 ${xi1} ${yi1} Z" fill="${s.color}"><title>${esc(s.label)}: ${s.value}</title></path>`; a=a2; });
  return `<svg viewBox="0 0 140 140" width="150" height="150" style="margin:0 auto">${paths}<text x="70" y="66" text-anchor="middle" font-size="19" font-weight="800" fill="#0F172A">${tot}</text><text x="70" y="82" text-anchor="middle" font-size="9" fill="#94a3b8">PAID</text></svg><div class="chart-legend">${segs.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)} · ${s.value}</span>`).join('')}</div>`;
}

  const head=`<div class="toolbar"><label class="em">From</label><input type="date" id="rFrom" value="${d.from}" class="edit-input" style="width:140px"/>

  const kpi=(l,v,sub)=>`<div class="kpi"><div class="lab">${l}</div><div class="val">${v}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
  const conv=d.funnel&&d.funnel.started?Math.round(d.funnel.paid/d.funnel.started*100):0;

    ${kpi('Avg order',money(T.avg_order||0),'per payment')}
    ${kpi('Discounts given','−'+money((T.code_discounts||0)+(T.standard_discounts||0)),money(T.code_discounts||0)+' via codes')}
    ${kpi('Conversion',conv+'%',(d.funnel?d.funnel.paid:0)+' paid of '+(d.funnel?d.funnel.started:0)+' started · '+(d.new_members||0)+' new members')}</div>`;
  const rev=(d.revenue_daily||[]);

  const codes=(d.codes_perf||[]).map(r=>`<tr><td class="mono">${esc(r.code)}</td><td><span class="badge b-grey">${esc(r.code_type||'—')}</span></td><td>${esc(r.org_name||'—')}</td><td>${r.uses}</td><td class="num">−${money(r.discount_given)}</td><td class="num">${money(r.revenue)}</td></tr>`).join('')||'<tr><td colspan="6" class="em">No code redemptions in range.</td></tr>';
  const refs=(d.top_referrers||[]).map(r=>`<tr><td style="font-weight:600">${esc(r.name||'—')}</td><td class="em">${esc(r.email||'')}</td><td class="mono">${esc(r.code)}</td><td>${r.referrals}</td><td class="num">${money(r.revenue)}</td></tr>`).join('')||'<tr><td colspan="5" class="em">No referral activity yet.</td></tr>';
  const geo=(d.by_country||[]).map(r=>`<tr><td style="font-weight:600">${esc(r.country)}</td><td>${r.n}</td><td class="num">${money(r.revenue)}</td></tr>`).join('')||'<tr><td colspan="3" class="em">—</td></tr>';
  $('#view').innerHTML=head+kpis+
    `<div class="panel"><div class="panel-h"><h3>Revenue by day</h3><div class="spacer"></div><span class="badge b-blue">${d.from} → ${d.to}</span></div><div class="panel-b">${chart}</div></div>
     <div class="grid-2"><div class="panel"><div class="panel-h"><h3>Revenue by product</h3></div><div class="panel-b"><table><thead><tr><th>Product</th><th>Sales</th><th style="text-align:right">Revenue</th></tr></thead><tbody>${prod}</tbody></table></div></div>
     <div class="panel"><div class="panel-h"><h3>Geography</h3></div><div class="panel-b"><table><thead><tr><th>Country</th><th>Payments</th><th style="text-align:right">Revenue</th></tr></thead><tbody>${geo}</tbody></table></div></div></div>
     <div class="panel" style="margin-top:20px"><div class="panel-h"><h3>Discount code performance</h3><div class="spacer"></div><button class="btn btn-sm" data-export="redemptions">Export CSV</button></div><div class="panel-b"><table><thead><tr><th>Code</th><th>Type</th><th>Issued to</th><th>Uses</th><th style="text-align:right">Discount given</th><th style="text-align:right">Revenue</th></tr></thead><tbody>${codes}</tbody></table></div></div>
     <div class="panel"><div class="panel-h"><h3>Top referrers</h3></div><div class="panel-b"><table><thead><tr><th>Member</th><th></th><th>Code</th><th>Referrals</th><th style="text-align:right">Revenue</th></tr></thead><tbody>${refs}</tbody></table></div></div>`;
  $('#rGo').onclick=()=>{state.filters.from=$('#rFrom').value;state.filters.to=$('#rTo').value;renderReports();};
  document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{state.filters.from=new Date(Date.now()-(+b.dataset.preset)*864e5).toISOString().slice(0,10);state.filters.to=today;renderReports();});
  wireExport();

/* Manual onboarding: creates the account only (no membership/entitlement/credential — payment
   remains the sole path to those). Shows the returned password-setup link so onboarding works
   even before SMTP is configured. */
function addMemberModal(){
  modal('Add member',`
    <div class="fld"><label>Email</label><input id="amEmail" type="email" placeholder="person@example.com"/></div>
    <div class="fld"><label>First name</label><input id="amFirst"/></div>
    <div class="fld"><label>Last name</label><input id="amLast"/></div>
    <div class="inline-note">Creates a student account and a password-setup link. It grants no membership, exam entitlement or credential — those still require payment.</div>
    <div id="amMsg"></div>`,'Create account',async()=>{
    const email=$('#amEmail').value.trim(), first=$('#amFirst').value.trim(), last=$('#amLast').value.trim();
    const msg=$('#amMsg');
    if(!email){ msg.innerHTML='<div class="inline-note" style="color:#c0392b">Email is required.</div>'; return false; }
    try{
      const r=await api('/api/admin/members',{method:'POST',body:JSON.stringify({email,first_name:first,last_name:last})});
      msg.innerHTML=`<div class="inline-note" style="word-break:break-all"><b>Account created.</b> Send this password-setup link to the member (also emailed when SMTP is configured):<br><span class="mono" id="amLink">${esc(r.setup_url||'')}</span><br><button class="btn btn-sm" style="margin-top:6px" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('amLink').textContent).then(()=>toast('Link copied','ok'))">Copy link</button></div>`;
      renderMembers();
      return false; // keep the modal open so the admin can copy the link
    }catch(e){
      msg.innerHTML=`<div class="inline-note" style="color:#c0392b">${e.message==='email_exists'?'That email already has an account — use “Resend setup link” on the member instead.':e.message==='invalid_email'?'Please enter a valid email address.':'Could not create the account: '+esc(e.message)}</div>`;
      return false;
    }
  });
}
async function renderCpdQueue(){
  let rows=[]; try{rows=(await api('/api/admin/cpd?status=recorded')).rows||[];}catch(_){ }
  const who=r=>esc(((r.first_name||'')+' '+(r.last_name||'')).trim()||r.email||('user '+r.user_id));
  const body=rows.length?rows.map(r=>`<tr><td><b>${who(r)}</b><br><span class="em">${esc(r.category)} · ${esc(r.activity_date||'')}</span></td>
    <td class="em" style="max-width:360px">${esc(String(r.description||'').slice(0,140))}${r.evidence_name?`<br><button class="btn btn-sm" data-cpev="${r.id}">📎 ${esc(r.evidence_name)}</button>`:'<br><span class="em" style="font-size:11px">no evidence attached</span>'}</td>
    <td style="font-weight:700">${r.hours}h</td>
    <td class="actions"><button class="btn btn-sm btn-primary" data-cpok="${r.id}">Approve</button> <button class="btn btn-sm" data-cpno="${r.id}">Reject…</button></td></tr>`).join(''):'<tr><td colspan="4" class="em" style="padding:14px">No CPD entries awaiting review.</td></tr>';
  $('#view').insertAdjacentHTML('beforeend',`
    <h3 style="margin:26px 0 10px">CPD review queue <span class="badge b-amber" style="vertical-align:2px">${rows.length} awaiting</span></h3>
    <div class="inline-note" style="margin-bottom:10px">Entries return here whenever a member records activity or attaches new evidence. Approved hours count toward recertification.</div>
    <table class="tbl"><tr><th>Member</th><th>Activity</th><th>Hours</th><th></th></tr>${body}</table>`);
  document.querySelectorAll('[data-cpev]').forEach(b=>b.onclick=()=>openBlob('/api/admin/cpd/'+b.dataset.cpev+'/evidence'));
  document.querySelectorAll('[data-cpok]').forEach(b=>b.onclick=async()=>{await api('/api/admin/cpd/'+b.dataset.cpok+'/review',{method:'POST',body:JSON.stringify({status:'approved'})});toast('CPD approved','ok');renderMembers();});
  document.querySelectorAll('[data-cpno]').forEach(b=>b.onclick=()=>{const id=b.dataset.cpno;
    modal('Reject CPD entry #'+id,'<div class="form-row"><label>Reason (shown to the member)</label><textarea id="cpNote" rows="3" placeholder="e.g. Evidence does not support the claimed hours…"></textarea></div>','Reject',async()=>{
      const note=($('#cpNote').value||'').trim(); if(note.length<5){toast('Please give a reason','err');return false;}
      await api('/api/admin/cpd/'+id+'/review',{method:'POST',body:JSON.stringify({status:'rejected',admin_note:note})});toast('CPD rejected','ok');renderMembers();return true;});});
}

/* ---------- SECURE EXAM / PROCTORING ---------- */
function sevBadge(sev){const m={Critical:'b-red',High:'b-red',Medium:'b-amber',Low:'b-grey',Info:'b-blue'};return `<span class="badge ${m[sev]||'b-grey'}">${esc(sev)}</span>`;}
function idBadge(r){if(!r)return '<span class="badge b-grey">—</span>';const ok=r==='Verified';return `<span class="badge ${ok?'b-green':r==='NoFace'||r==='MismatchLikely'?'b-red':'b-amber'}"><span class="dot"></span>${esc(r)}</span>`;}
function revBadge(st){const m={unreviewed:['b-amber','Needs review'],cleared:['b-green','Cleared'],invalidated:['b-red','Invalidated']};const x=m[st]||['b-grey',st||'—'];return `<span class="badge ${x[0]}">${x[1]}</span>`;}
function mmss(sec){sec=Math.max(0,+sec||0);const m=Math.floor(sec/60),x=sec%60;return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');}
function beatBadge(sb){sb=+sb||0;if(sb<=12)return '<span class="badge b-green"><span class="dot"></span>Live</span>';if(sb<=45)return '<span class="badge b-amber"><span class="dot"></span>Lagging '+sb+'s</span>';return '<span class="badge b-red"><span class="dot"></span>Offline '+sb+'s</span>';}
function liveCardsHTML(rows){
  if(!rows.length) return '<div class="inline-note">No candidates are sitting the examination right now. Sessions appear here the moment a candidate begins, refreshing every 5 seconds.</div>';
  return '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">'+rows.map(r=>{
    const name=esc(((r.first_name||'')+' '+(r.last_name||'')).trim())||'—';
    return `<div class="kpi" style="padding:14px 16px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div style="font-weight:700">${name}</div>${beatBadge(r.seconds_since_beat)}
      </div>
      <div class="em" style="margin:2px 0 8px">${esc(r.email||'')}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <span class="badge b-blue" style="font-family:ui-monospace,Consolas,monospace">${mmss(r.remaining_s)} left</span>
        ${r.client_kind==='desktop'?'<span class="badge b-blue">Secure app</span>':'<span class="badge b-grey">Browser</span>'}
        ${r.high_events>0?`<span class="badge b-red"><span class="dot"></span>${r.high_events} flag${r.high_events>1?'s':''}</span>`:'<span class="badge b-green">Clean</span>'}
        ${r.candidate_msgs>0?`<span class="badge b-amber">${r.candidate_msgs} msg${r.candidate_msgs>1?'s':''}</span>`:''}
      </div>
      <div style="margin-top:10px"><button class="btn btn-sm btn-primary" data-live-open="${r.id}">Open session</button></div>
    </div>`;}).join('')+'</div>';
}

      </div>
      <div style="display:flex;gap:8px">
        <input id="pmBody" class="edit-input" style="flex:1" placeholder="Message the candidate…" aria-label="Message the candidate…"/>
        <button class="btn btn-sm btn-primary" id="pmSend">Send</button>

  `, `
    ${a.result_status==='auto_held'?'<button class="btn btn-primary" id="sRelease">Release held result</button>':''}

    ${a.review_status==='invalidated'?'<button class="btn" id="sReinstate">Reinstate</button>':a.result_status==='auto_held'?'':'<button class="btn btn-primary" id="sClear">Mark reviewed ✓</button>'}
  `);
  // Hydrate evidence thumbnails as authenticated blobs (images can't send bearer tokens via src).
  document.querySelectorAll('[data-evimg]').forEach(async img=>{try{img.src=await apiBlob('/api/admin/evidence/'+img.dataset.evimg);img.onclick=()=>{const w=window.open();if(w)w.document.write('<img src="'+img.src+'" style="max-width:100%"/>');};}catch(_){img.alt='(unavailable)';}});
  const pmSend=$('#pmSend');
  if(pmSend){const send=async()=>{const v=(($('#pmBody')||{}).value||'').trim();if(!v)return;
    await api('/api/admin/exam-sessions/'+a.id+'/message',{method:'POST',body:JSON.stringify({body:v})});
    toast('Message queued — delivers on the candidate\'s next heartbeat','ok');openSession(a.id);};
    pmSend.onclick=send;const pb=$('#pmBody');if(pb)pb.onkeydown=e=>{if(e.key==='Enter')send();};}
  const note=()=>({note:($('#revNote')||{}).value||''});
  const act=async(action,msg)=>{await api('/api/admin/exam-sessions/'+a.id+'/review',{method:'POST',body:JSON.stringify({action,...note()})});toast(msg,action==='invalidate'?'':'ok');closeDrawer&&closeDrawer();renderProctoring();};
  const rl=$('#sRelease');if(rl)rl.onclick=()=>act('release','Held result released — student can now see it');
  const iv=$('#sInvalidate');if(iv)iv.onclick=()=>act('invalidate','Result invalidated — credential revoked');
  const cl=$('#sClear');if(cl)cl.onclick=()=>act('reviewed','Session marked reviewed');
  const ri=$('#sReinstate');if(ri)ri.onclick=()=>act('reinstate','Result reinstated','ok');
}
function fmtTime(s){if(!s)return'—';const d=new Date(String(s).replace(' ','T'));return isNaN(d)?esc(s):d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}

async function renderAppSettings(app){
  const schema=SETTINGS_SCHEMA[app];
  let cur={}; try{ cur=await api('/api/admin/settings'); }catch(_){ cur={}; }
  const val=k=>cur[k];
  const boolOn=k=>String(val(k))==='1'||String(val(k)).toLowerCase()==='true';
  const rowHTML=it=>{
    let control='';
    if(it.t==='bool'){
      control=`<label class="swch"><input type="checkbox" data-set="${it.k}" data-type="bool" ${boolOn(it.k)?'checked':''}/><span class="track"></span><span class="knob"></span></label>`;
    } else if(it.t==='select'){
      control=`<select class="setsel" data-set="${it.k}" data-type="text">${(it.opts||[]).map(o=>`<option value="${esc(o)}"${String(val(it.k))===o?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
    } else if(it.t==='num'){
      control=`<input class="setinput" type="number" data-set="${it.k}" data-type="num" value="${esc(val(it.k)??'')}"/>${it.suffix?`<span class="em" style="font-size:12px">${it.suffix}</span>`:''}`;
    } else {
      control=`<input class="setinput ${it.wide?'wide':''}" type="text" data-set="${it.k}" data-type="text" value="${esc(val(it.k)??'')}"/>`;
    }
    return `<div class="setrow"><div><div class="sk">${it.label}</div>${it.desc?`<div class="sd">${it.desc}</div>`:''}</div><div class="sv">${control}</div></div>`;
  };
  const panels=schema.groups.map(g=>`<div class="panel"><div class="panel-h"><h3>${g.h}</h3></div><div class="panel-b">${g.items.map(rowHTML).join('')}</div></div>`).join('');
  $('#view').innerHTML=`<div class="inline-note" style="margin-bottom:16px">${schema.intro}</div>${panels}
    <div class="setbar"><button class="btn btn-primary" id="setSave">Save changes</button><button class="btn" id="setReset">Reset</button><span class="dirty" id="setDirty"></span></div>`;

  const dirty=new Set();
  const mark=()=>{ $('#setDirty').textContent=dirty.size?dirty.size+' unsaved change'+(dirty.size>1?'s':''):''; };
  document.querySelectorAll('[data-set]').forEach(el=>{
    const ev=el.type==='checkbox'||el.tagName==='SELECT'?'change':'input';
    el.addEventListener(ev,()=>{ dirty.add(el.dataset.set); mark(); });
  });
  $('#setSave').onclick=async()=>{
    const body={};
    document.querySelectorAll('[data-set]').forEach(el=>{
      if(!dirty.has(el.dataset.set))return;
      body[el.dataset.set]= el.dataset.type==='bool' ? (el.checked?'1':'0') : el.value;
    });
    if(!Object.keys(body).length){ toast('Nothing to save'); return; }
    try{ await api('/api/admin/settings',{method:'PATCH',body:JSON.stringify(body)}); toast('Settings saved','ok'); dirty.clear(); mark(); }
    catch(e){ toast('Save failed','err'); }
  };
  $('#setReset').onclick=()=>renderAppSettings(app);
}

function roleBadge(r){ const c=r==='owner'?'r-owner':r==='custom'?'r-custom':r==='viewer'?'r-viewer':'r-mgr'; return `<span class="rolebadge ${c}">${esc(String(r).replace(/_/g,' '))}</span>`; }
function sectionLabel(id){ const f=SECTIONS.find(x=>x.id===id); return f?f.label.replace(/&amp;/g,'&'):id; }
function permBoxes(sections, checked){
  const names={platform:'Platform',website:'\u2460 Website',student:'\u2461 Student Panel',exam:'\u2462 Live Exam'};
  return '<div class="permwrap">'+Object.entries(sections).map(([app,ids])=>{
    const list=ids.filter(id=>id!=='team');
    return `<div class="permgroup"><h6>${names[app]||app}</h6>`+list.map(id=>
      `<label><input type="checkbox" data-perm="${id}" ${checked.includes(id)?'checked':''}/> ${esc(sectionLabel(id))}</label>`).join('')+'</div>';
  }).join('')+'</div>';
}
function readPerms(){ return Array.from(document.querySelectorAll('[data-perm]:checked')).map(x=>x.dataset.perm); }
function wireRolePrefill(meta){
  const sel=document.querySelector('[data-rolesel]'); if(!sel)return;
  sel.onchange=()=>{ const grants=(sel.value==='custom')?[]:(meta.role_grants[sel.value]||[]);
    document.querySelectorAll('[data-perm]').forEach(cb=>cb.checked=grants.includes(cb.dataset.perm)); };
}

/* ---------- drawer / modal ---------- */
function drawer(title,sub,body,actions){
  const d=$('#drawer');
  d.innerHTML=`<div class="drawer-h"><div><h3>${title}</h3><div class="em">${sub||''}</div></div><button class="x" onclick="closeDrawer()">×</button></div><div class="drawer-b">${body}</div>${(actions&&actions.length)?`<div class="dactions" id="dact"></div>`:''}`;
  if(actions&&actions.length){ const wrap=$('#dact'); actions.forEach(a=>{ const b=document.createElement('button'); b.className=a.cls; b.textContent=a.label; b.onclick=async()=>{b.disabled=true;try{await a.act();}catch(e){toast('Action failed','err');}b.disabled=false;}; wrap.appendChild(b); }); }
  $('#scrim').classList.add('open'); d.classList.add('open');
}
function closeDrawer(){const _d=document.querySelector('.drawer'); if(_d)_d.classList.remove('wide');  $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open'); }
$('#scrim').onclick=closeDrawer;
let _modalOk=null;
function modal(title,body,okLabel,onOk){
  _modalOk=onOk;
  $('#modalScrim').innerHTML=`<div class="modal"><div class="modal-h"><h3>${title}</h3></div><div class="modal-b">${body}</div><div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="modalOk">${okLabel}</button></div></div>`;
  $('#modalScrim').classList.add('open');
  $('#modalOk').onclick=async()=>{ const btn=$('#modalOk'); btn.disabled=true; const keep=await _modalOk?.(); btn.disabled=false; if(keep!==false) closeModal(); };

  if((m=P.match(/^\/api\/admin\/members\/(\d+)\/referral-code$/))){ const u=S.users.find(x=>x.id==m[1]); const ex=S.codes.find(c=>c.code_type==='referral'&&c.owner_user_id==u.id&&c.active); if(ex) return Promise.resolve({code:ex.code,existing:true}); const code='REF-'+(u.first_name||'PCI').toUpperCase().slice(0,6)+'-'+Math.random().toString(36).slice(2,6).toUpperCase(); S.codes.push({id:Date.now(),code,discount_type:'percentage',discount_value:10,applies_to:'all',active:1,code_type:'referral',owner_user_id:u.id,owner_name:u.first_name+' '+u.last_name,per_user_limit:1,used_count:0,redemptions:0,discount_given:0,revenue_attributed:0}); return Promise.resolve({code}); }
  if(P==='/api/admin/reports'){
    const from=p.get('from')||new Date(Date.now()-29*864e5).toISOString().slice(0,10), to=p.get('to')||new Date().toISOString().slice(0,10);
    const inR=x=>{const d=(x.payment_date||'').slice(0,10);return d>=from&&d<=to&&x.payment_status==='paid';};
    const paid=S.payments.filter(inR);
    const byD={}; paid.forEach(x=>{const dd=x.payment_date.slice(0,10);byD[dd]=byD[dd]||{revenue:0,n:0};byD[dd].revenue+=x.final_amount;byD[dd].n++;});
    const byP={}; paid.forEach(x=>{byP[x.product_type]=byP[x.product_type]||{n:0,revenue:0};byP[x.product_type].n++;byP[x.product_type].revenue+=x.final_amount;});
    const geo={}; paid.forEach(x=>{const u=S.users.find(u=>u.id===x.user_id);const c=(u&&u.profile.country)||'Unknown';geo[c]=geo[c]||{n:0,revenue:0};geo[c].n++;geo[c].revenue+=x.final_amount;});
    const redsIn=S.redemptions.filter(r=>{const d=(r.redeemed_at||'').slice(0,10);return d>=from&&d<=to;});
    const cp={}; redsIn.forEach(r=>{const c=S.codes.find(k=>k.id===r.code_id); if(!c)return; cp[c.code]=cp[c.code]||{code:c.code,code_type:c.code_type,org_name:c.org_name,uses:0,discount_given:0,revenue:0}; cp[c.code].uses++;cp[c.code].discount_given+=r.discount_amount||0;cp[c.code].revenue+=r.final_amount||0;});
    const refs=S.codes.filter(c=>c.code_type==='referral'&&c.redemptions>0).map(c=>({name:c.owner_name,email:(S.users.find(u=>u.id===c.owner_user_id)||{}).email,code:c.code,referrals:c.redemptions,revenue:c.revenue_attributed}));
    return Promise.resolve({from,to,
      totals:{payments:paid.length,revenue:paid.reduce((a,x)=>a+x.final_amount,0),code_discounts:paid.reduce((a,x)=>a+(x.discount_code_amount||0),0),standard_discounts:paid.reduce((a,x)=>a+(x.default_discount_amount||0),0),avg_order:paid.length?paid.reduce((a,x)=>a+x.final_amount,0)/paid.length:0},
      revenue_daily:Object.entries(byD).sort().map(([d,v])=>({d,revenue:v.revenue,n:v.n})),
      by_product:Object.entries(byP).map(([product_type,v])=>({product_type,...v})).sort((a,b)=>b.revenue-a.revenue),
      codes_perf:Object.values(cp).sort((a,b)=>b.revenue-a.revenue),
      top_referrers:refs.sort((a,b)=>b.referrals-a.referrals),
      by_country:Object.entries(geo).map(([country,v])=>({country,...v})).sort((a,b)=>b.revenue-a.revenue).slice(0,12),
      funnel:{started:S.enroll.filter(e=>{const d=(e.created_at||'').slice(0,10);return d>=from&&d<=to;}).length||S.enroll.length,paid:paid.length},
      new_members:S.users.filter(u=>{const d=(u.created_at||'').slice(0,10);return d>=from&&d<=to;}).length});
  }
  if(P==='/api/admin/codes'&&method==='GET') return Promise.resolve(S.codes);
  if(P==='/api/admin/codes'&&method==='POST'){ S.codes.unshift({id:Date.now(),code:body.code,discount_type:body.discount_type,discount_value:body.discount_value,applies_to:body.applies_to,max_uses:body.max_uses,used_count:0,end_date:body.end_date,active:1}); return Promise.resolve({id:1}); }
  if((m=P.match(/^\/api\/admin\/codes\/(\d+)$/))){ const c=S.codes.find(x=>x.id==m[1]); if(c&&body.active!=null)c.active=body.active?1:0; return ok(); }
  if(P==='/api/admin/pricing'&&method==='GET') return Promise.resolve(S.pricing);
  if((m=P.match(/^\/api\/admin\/pricing\/(\d+)$/))){ const pr=S.pricing.find(x=>x.id==m[1]); if(pr){if(body.standard_price!=null)pr.standard_price=body.standard_price;if(body.default_discount_percentage!=null)pr.default_discount_percentage=body.default_discount_percentage;if(body.active!=null)pr.active=body.active;} return ok(); }
  if(P==='/api/admin/run-reminders'){ const due=S.enroll.filter(e=>e.session_status==='in_progress'&&(e.reminders_sent||0)<3); due.forEach(e=>{e.reminders_sent=(e.reminders_sent||0)+1;}); return Promise.resolve({ok:true,reminders_sent:due.length}); }
  return Promise.resolve({rows:[]});
}

async function renderCrud(cfg){
  const raw=await api('/api/admin/'+cfg.endpoint); const rows=(raw.rows||raw||[]);
  const cols=cfg.columns.map(c=>({t:c.label})).concat([{t:''}]);
  const cell=(r,c)=>{ let v=r[c.k];
    if(c.fmt) return '<td>'+c.fmt(v)+'</td>';
    if(c.badge) return '<td>'+badge(v)+'</td>';
    if(c.bool) return '<td>'+(Number(v)?'<span class="badge b-green"><span class="dot"></span>yes</span>':'<span class="badge b-grey"><span class="dot"></span>no</span>')+'</td>';
    if(c.pct) return '<td>'+(v||0)+'%</td>';
    if(c.mono) return '<td class="mono">'+esc(v==null||v===''?'—':v)+'</td>';
    if(c.long){ const t=String(v==null?'':v); return '<td class="em">'+esc(t.slice(0,70))+(t.length>70?'…':'')+'</td>'; }
    return '<td'+(c.strong?' style="font-weight:600"':'')+'>'+esc(v==null||v===''?'—':v)+'</td>'; };
  const body=rows.length?rows.map(r=>'<tr>'+cfg.columns.map(c=>cell(r,c)).join('')+'<td class="actions"><button class="btn btn-sm" data-edit="'+r.id+'">Edit</button> <button class="btn btn-sm btn-danger" data-del="'+r.id+'">Delete</button></td></tr>').join(''):emptyRow(cols.length,cfg.empty);
  $('#view').innerHTML=(cfg.intro?'<div class="inline-note" style="margin-bottom:16px">'+cfg.intro+'</div>':'')+
    '<div class="toolbar"><div class="spacer"></div><button class="btn btn-primary btn-sm" id="addNew">'+sico('grid')+' '+(cfg.add||'New')+'</button></div>'+
    tableShell(cols,body,'<div class="tfoot"><span>'+rows.length+' '+(cfg.unit||'item')+(rows.length===1?'':'s')+'</span></div>');
  $('#addNew').onclick=()=>editCrud(cfg,null);
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editCrud(cfg,rows.find(r=>r.id==b.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(!confirm('Delete this '+(cfg.noun||'item')+'?'))return; await api('/api/admin/'+cfg.endpoint+'/'+b.dataset.del,{method:'DELETE'}); toast('Deleted'); renderCrud(cfg); });
}
function editCrud(cfg,row){
  modal((row?'Edit ':'New ')+(cfg.noun||'item'), cfg.fields.map(f=>fieldHTML(f,row)).join(''), row?'Save changes':'Create', async()=>{
    const b={};
    for(const f of cfg.fields){ const el=$('#f_'+f.k); if(!el)continue; b[f.k]= f.type==='checkbox'?(el.checked?1:0): f.type==='number'?(el.value===''?0:+el.value): el.value; }
    for(const f of cfg.fields) if(f.required && (b[f.k]===''||b[f.k]==null)){ toast(f.label+' is required','err'); return false; }
    if(row) await api('/api/admin/'+cfg.endpoint+'/'+row.id,{method:'PATCH',body:JSON.stringify(b)});
    else await api('/api/admin/'+cfg.endpoint,{method:'POST',body:JSON.stringify(b)});
    toast(row?'Saved':'Created','ok'); renderCrud(cfg); return true;
  });
}
function fieldHTML(f,row){

  if(f.type==='checkbox') return '<div class="form-row"><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="f_'+f.k+'" style="width:auto" '+(Number(v)?'checked':'')+'/> '+f.label+'</label></div>';

/* ---- Reviews / testimonials moderation ---- */
async function renderReviews(){
  const d=await api('/api/admin/reviews');
  let rows=d.reviews||[]; const c=d.counts||{};
  if(state.filters.status) rows=rows.filter(r=>r.status===state.filters.status);
  if(state.q){ const q=state.q.toLowerCase(); rows=rows.filter(r=>((r.name||'')+' '+(r.company||'')+' '+(r.body||'')).toLowerCase().includes(q)); }
  const tb=toolbar([{id:'status',label:'All statuses',options:[['pending','Pending'],['published','Published'],['rejected','Rejected']]}]);
  const stars=n=>{n=Math.max(0,Math.min(5,+n||0));return '★'.repeat(n)+'☆'.repeat(5-n);};
  const badge=s=>s==='published'?'<span class="badge b-green"><span class="dot"></span>Published</span>':s==='rejected'?'<span class="badge b-grey"><span class="dot"></span>Rejected</span>':'<span class="badge b-amber"><span class="dot"></span>Pending</span>';
  const cols=[{t:'Reviewer'},{t:'Rating'},{t:'Review'},{t:'Status'},{t:'Home'},{t:''}];
  const body=rows.length?rows.map(r=>{
    const who=[esc(r.designation),esc(r.company),esc(r.country)].filter(Boolean).join(' · ');
    return `<tr data-id="${r.id}"><td><b>${esc(r.name)}</b>${who?`<br><span class="em">${who}</span>`:''}</td>
      <td style="color:#F59E0B;white-space:nowrap">${stars(r.rating)}</td>
      <td class="em">${r.title?`<b>${esc(r.title)}</b><br>`:''}${esc(String(r.body||'').slice(0,90))}${(r.body||'').length>90?'…':''}</td>
      <td>${badge(r.status)}</td>
      <td>${Number(r.featured)?'<span class="badge b-green">★ Home</span>':'—'}</td>
      <td class="actions">
        ${r.status!=='published'?`<button class="btn btn-sm btn-primary" data-pub="${r.id}">Publish</button> `:''}
        ${r.status==='published'?`<button class="btn btn-sm" data-feat="${r.id}" data-on="${Number(r.featured)?1:0}">${Number(r.featured)?'Unfeature':'Feature on home'}</button> `:''}
        ${r.status!=='rejected'?`<button class="btn btn-sm" data-rej="${r.id}">Reject</button> `:''}
        <button class="btn btn-sm btn-danger" data-del="${r.id}">Delete</button>
      </td></tr>`;}).join(''):emptyRow(cols.length,'No reviews match.');
  $('#view').innerHTML=`<div class="inline-note" style="margin-bottom:16px">Member-submitted reviews. <b>${c.pending||0}</b> pending · <b>${c.published||0}</b> published · <b>${c.featured||0}</b> featured on the home page. Publishing a review shows it on the public <b>Reviews</b> page; “Feature on home” also shows it in the home-page strip before the footer.</div>`+tb+tableShell(cols,body,`<div class="tfoot"><span>${rows.length} review(s)</span></div>`);
  wireToolbar(renderReviews);
  const setStatus=async(id,status)=>{ await api('/api/admin/reviews/'+id+'/status',{method:'POST',body:JSON.stringify({status})}); toast('Review '+status,'ok'); renderReviews(); };
  document.querySelectorAll('[data-pub]').forEach(b=>b.onclick=()=>setStatus(b.dataset.pub,'published'));
  document.querySelectorAll('[data-rej]').forEach(b=>b.onclick=()=>setStatus(b.dataset.rej,'rejected'));
  document.querySelectorAll('[data-feat]').forEach(b=>b.onclick=async()=>{ await api('/api/admin/reviews/'+b.dataset.feat,{method:'PATCH',body:JSON.stringify({featured:b.dataset.on==='1'?0:1})}); toast('Home-page selection updated','ok'); renderReviews(); });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(!confirm('Delete this review permanently?'))return; await api('/api/admin/reviews/'+b.dataset.del,{method:'DELETE'}); toast('Review deleted','ok'); renderReviews(); });
}

async function editPage(p){ if(!p)return;
  // pull the page's editable content blocks (headline + any data-cms regions)
  let pc={blocks:{}}; try{ pc=await api('/api/page-content?slug='+encodeURIComponent(p.slug)); }catch(_){}
  const blocks=pc.blocks||{};
  const headline=blocks._h1||'';
  // any additional (non-positional) content regions the page exposes
  const extra=Object.keys(blocks).filter(k=>k!=='_h1');
  const extraHtml=extra.map(k=>`<div class="form-row"><label>Content region — <span class="mono">${esc(k)}</span></label><textarea class="pb-input" data-key="${esc(k)}" rows="2">${esc(blocks[k]||'')}</textarea></div>`).join('');
  modal('Edit page — '+esc(p.slug),
    `<div class="form-row"><label>Headline (the page's main <b>H1</b>)</label><input id="pH1" value="${esc(headline)}" placeholder="Shown at the top of the page"/></div>
     <div class="form-row"><label>Page title (browser tab &amp; search result — SEO)</label><input id="pTitle" value="${esc(p.title||'')}"/></div>
     <div class="form-row"><label>Meta description (search result summary)</label><textarea id="pDesc" rows="3">${esc(p.meta_description||'')}</textarea><div style="font-size:11px;color:var(--mist);margin-top:4px" id="pCount"></div></div>
     ${extraHtml}
     <div class="form-row"><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="pNoindex" style="width:auto" ${Number(p.noindex)?'checked':''}/> Hide from search engines (noindex)</label></div>
     <div class="inline-note">URL: <span class="mono">${esc(p.slug)}</span> · <a href="/${esc(p.slug)}" target="_blank" rel="noopener">open live page ↗</a>. Changes are live immediately.</div>`,
    'Save changes',async()=>{
      await api('/api/admin/pages/'+p.id,{method:'PATCH',body:JSON.stringify({title:$('#pTitle').value,meta_description:$('#pDesc').value,noindex:$('#pNoindex').checked?1:0})});
      // headline block (upsert on slug:_h1) + any edited content regions
      const jobs=[api('/api/admin/page-blocks',{method:'POST',body:JSON.stringify({slug:p.slug,block_key:'_h1',label:'Headline',cvalue:$('#pH1').value})})];
      document.querySelectorAll('.pb-input').forEach(t=>jobs.push(api('/api/admin/page-blocks',{method:'POST',body:JSON.stringify({slug:p.slug,block_key:t.dataset.key,cvalue:t.value})})));
      await Promise.all(jobs);
      toast('Page updated — live now','ok'); renderPages(); return true;
    });
  setTimeout(()=>{ const t=$('#pDesc'); const upd=()=>{const l=t.value.length;$('#pCount').textContent=l+' characters'+(l>160?' — over 160, may be truncated in search':'');}; t.addEventListener('input',upd); upd(); },30);
}

policy.html", "published": 1, "sort_order": 20, "id": 20}, {"title": "AI Governance Policy", "category": "Governance &amp; conduct", "doc_type": "Page", "url": "ai-policy.html", "published": 1, "sort_order": 21, "id": 21}, {"title": "all policies &amp; documents", "category": "Governance &amp; conduct", "doc_type": "Page", "url": "policies.html", "published": 1, "sort_order": 22, "id": 22}, {"title": "contact us", "category": "Governance &amp; conduct", "doc_type": "Page", "url": "contact.html", "published": 1, "sort_order": 23, "id": 23}, {"title": "corporate &amp; bulk enrolment", "category": "Governance &amp; conduct", "doc_type": "Page", "url": "corporate-programs.html", "published": 1, "sort_order": 24, "id": 24}], "faqs": [{"question": "What is the PCP-AI credential?", "answer": "The Certified Project Controls Professional — AI (PCP-AI) is a single, rigorous credential covering project controls, cost engineering and project finance, with the governed use of artificial intelligence treated as part of the discipline. It is awarded by the Project Controls Institute and built with reference to  ISO/IEC 17024", "category": "General", "sort_order": 1, "published": 1, "id": 1}, {"question": "Who is the PCP-AI for?", "answer": "It is for the people who hold major projects to plan, cost and cash flow: planners, schedulers, cost engineers, project-controls and PMO professionals, and project-finance specialists across construction, energy, infrastructure and software.", "category": "General", "sort_order": 2, "published": 1, "id": 2}, {"question": "Is the PCP-AI accredited?", "answer": "PCI is an independent certifying body. Our examinations are being developed with reference to ISO/IEC 17024. We describe our status honestly at every stage and make no claims beyond what is true today.", "category": "General", "sort_order": 3, "published": 1, "id": 3}, {"question": "How do I qualify to sit the exam?", "answer": "There are two routes: an experience route for practitioners with relevant project-controls experience, and a foundation route for those newer to the field. Full  eligibility", "category": "General", "sort_order": 4, "published": 1, "id": 4}, {"question": "What does the examination involve?", "answer": "The exam tests applied judgement rather than recall: scenario-based multiple-choice questions across the ten sections (93 Knowledge Areas), including the governed use of AI. It is proctored, online or at a test centre.", "category": "General", "sort_order": 5, "published": 1, "id": 5}, {"question": "How is the credential maintained?", "answer": "The PCP-AI runs on a three-year continuing-professional-development (CPD) cycle. Membership keeps your credential current and tracks your CPD.", "category": "General", "sort_order": 6, "published": 1, "id": 6}, {"question": "How much does it cost?", "answer": "Fees for the inaugural cohort are confirmed at enrolment. Members receive reduced rates on examinations and events.", "category": "General", "sort_order": 7, "published": 1, "id": 7}, {"question": "Why is AI part of a project-controls credential?", "answer": "Because AI is already in the toolkit. The PCP-AI assesses the applied, governed use of AI across forecasting, risk and reporting — not generic AI literacy. Every output a certified professional relies on must be explainable, validated and owned by a competent human. In short: AI proposes; the professional disposes.", "category": "General", "sort_order": 8, "published": 1, "id": 8}, {"question": "What does membership include?", "answer": "Membership provides  recertification", "category": "General", "sort_order": 9, "published": 1, "id": 9}, {"question": "Can my organisation certify a whole team?", "answer": "Yes. Employers can upskill an existing function or build a new project-controls capability to one benchmarked standard.  Read more for employers", "category": "General", "sort_order": 10, "published": 1, "id": 10}, {"question": "Does PCI also sell exam preparation?", "answer": "No. PCI develops and owns the standard and the examination. Preparation and training are provided separately by Certuvo, our official partner. This separation supports the  impartiality", "category": "General", "sort_order": 11, "published": 1, "id": 11}, {"question": "How can I verify someone's credential?", "answer": "Use the credential lookup on the  Verify page", "category": "General", "sort_order": 12, "published": 1, "id": 12}], "bok_domains": [{"code": "D1", "name": "Governance & Ethics of Project Controls", "weight": 12, "description": "Frameworks, standards, professional conduct and the governed use of AI.", "sort_order": 1, "id": 1}, {"code": "D2", "name": "Planning & Scheduling", "weight": 16, "description": "Schedule development, analysis, acceleration and control.", "sort_order": 2, "id": 2}, {"code": "D3", "name": "Cost Estimating & Budgeting", "weight": 14, "description": "Estimating methods, budgeting and cost baselines.", "sort_order": 3, "id": 3}, {"code": "D4", "name": "Risk & Contingency Management", "weight": 12, "description": "Qualitative and quantitative risk analysis and contingency.", "sort_order": 4, "id": 4}, {"code": "D5", "name": "Earned Value & Performance Management", "weight": 14, "description": "EVM, forecasting, variance analysis and reporting.", "sort_order": 5, "id": 5}, {"code": "D6", "name": "Governed AI in Project Controls", "weight": 12, "description": "Applying AI with human oversight, validation and accountability.", "sort_order": 6, "id": 6}, {"code": "D7", "name": "Data, Systems & Reporting", "weight": 10, "description": "Project controls data, tooling, integration and reporting.", "sort_order": 7, "id": 7}, {"code": "D8", "name": "Project Finance & Funding", "weight": 10, "description": "Funding structures, cash flow and financial controls.", "sort_order": 8, "id": 8}], "sample_questions": [{"question": "Which metric best indicates cost efficiency in earned value management?", "options": "SPI\nCPI\nBAC\nETC", "answer_index": 1, "domain": "Earned Value & Performance", "published": 1, "sort_order": 2, "id": 1}, {"question": "When applying AI to schedule risk analysis, the professional’s primary responsibility is to:", "options": "Accept the AI output as final\nOversee, validate and remain accountable for the output\nAutomate the decision end-to-end\nWithhold the methodology", "answer_index": 1, "domain": "Governed AI", "published": 1, "sort_order": 3, "id": 2}, {"question": "A schedule performance index (SPI) of 0.85 indicates the project is:", "options": "Ahead of schedule\nOn schedule\nBehind schedule\nUnder budget", "answer_index": 2, "domain": "Planning & Scheduling", "published": 1, "sort_order": 4, "id": 3}, {"question": "Contingency reserves are best sized using:", "options": "A fixed 10% rule in all cases\nQuantitative risk analysis of the specific project\nThe client’s preference alone\nLast year’s average", "answer_index": 1, "domain": "Risk & Contingency", "published": 1, "sort_order": 5, "id": 4}, {"question": "The primary purpose of a cost baseline is to:", "options": "Replace estimates\nProvide the approved reference for performance measurement\nEliminate change control\nSet the contractor’s profit", "answer_index": 1, "domain": "Cost Estimating & Budgeting", "published": 1, "sort_order": 6, "id": 5}, {"question": "Under PCI’s governed-AI principle, “AI proposes, the professional disposes” means:", "options": "AI decisions are final\nThe professional reviews, adjusts and owns the decision\nAI must not be used\nOnly managers may use AI", "answer_index": 1, "domain": "Governed AI", "published": 1, "sort_order": 7, "id": 6}], "governance_roles": [{"role": "Chair, Certification Committee", "holder": null, "status": "open", "remit": "Oversees examination integrity, eligibility and credentialing policy.", "sort_order": 1, "id": 1}, {"role": "Chair, Standards Board", "holder": null, "status": "open", "remit": "Maintains the Body of Knowledge and the governed-AI standar function sampleCMS(path,opts={}){
  const P=path.split('?')[0], p=new URLSearchParams(path.split('?')[1]||''), method=(opts.method||'GET').toUpperCase(), body=opts.body?JSON.parse(opts.body):{}, ok=()=>Promise.resolve({ok:true});
  const ents=['faqs','bok_domains','sample_questions','governance_roles','resources','news','nav_items','media_assets'];
  for(const e of ents){
    if(P==='/api/admin/'+e){ if(method==='GET') return Promise.resolve({rows:S.cms[e]}); if(method==='POST'){ const id=Date.now(); S.cms[e].unshift(Object.assign({id},body)); return Promise.resolve({id}); } }
    const mm=P.match(new RegExp('^/api/admin/'+e+'/(\\d+)$'));
    if(mm){ const arr=S.cms[e], i=arr.findIndex(x=>x.id==mm[1]); if(method==='PATCH'){ if(i>=0)Object.assign(arr[i],body); return ok(); } if(method==='DELETE'){ if(i>=0)arr.splice(i,1); return ok(); } }
  }
  let m;
  if(P==='/api/admin/pages'&&method==='GET') return Promise.resolve({rows:S.cms.pages});
  if((m=P.match(/^\/api\/admin\/pages\/(\d+)$/))){ const i=S.cms.pages.findIndex(x=>x.id==m[1]); if(i>=0)Object.assign(S.cms.pages[i],body); return ok(); }
  if(P==='/api/admin/content'&&method==='GET') return Promise.resolve({rows:S.cms.content});
  if((m=P.match(/^\/api\/admin\/content\/(\d+)$/))){ const i=S.cms.content.findIndex(x=>x.id==m[1]); if(i>=0)S.cms.content[i].cvalue=body.cvalue; return ok(); }
  if(P==='/api/admin/subscribers'&&method==='GET') return Promise.resolve({rows:S.cms.subscribers});
  if((m=P.match(/^\/api\/admin\/subscribers\/(\d+)$/))){ const i=S.cms.subscribers.findIndex(x=>x.id==m[1]); if(i>=0)S.cms.subscribers[i].status=body.status; return ok(); }
  if(P==='/api/admin/form_submissions'&&method==='GET'){ let r=S.cms.form_submissions; const ty=p.get('type'),st=p.get('status'); if(ty)r=r.filter(x=>x.form_type===ty); if(st)r=r.filter(x=>x.status===st); return Promise.resolve({rows:r}); }
  if((m=P.match(/^\/api\/admin\/form_submissions\/(\d+)\/status$/))){ const i=S.cms.form_submissions.findIndex(x=>x.id==m[1]); if(i>=0)S.cms.form_submissions[i].status=body.status; return ok(); }
  if(P==='/api/admin/settings'&&method==='GET') return Promise.resolve(S.cms.settings);
  if(P==='/api/admin/settings'&&method==='PATCH'){ Object.assign(S.cms.settings,body); return ok(); }
  return null;
}
