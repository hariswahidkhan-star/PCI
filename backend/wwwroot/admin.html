async function renderTickets(){
  const d=await api('/api/admin/tickets'+qs({status:state.filters.status}));
  const rows=d.rows||[];
  const TS={open:['b-blue','Open'],awaiting_student:['b-amber','Awaiting student'],resolved:['b-green','Resolved'],closed:['b-grey','Closed']};
  const tb=toolbar([{id:'status',label:'All statuses',options:[['open','Open'],['awaiting_student','Awaiting student'],['resolved','Resolved'],['closed','Closed']]}]);
  const cols=[{t:'Reference'},{t:'Subject'},{t:'Student'},{t:'Category'},{t:'Msgs'},{t:'Status'},{t:'Updated'},{t:''}];
  const body=rows.length?rows.map(t=>`<tr class="clickable" data-id="${t.id}">
    <td class="mono">${esc(t.reference)}</td><td class="em" style="max-width:220px">${esc(String(t.subject).slice(0,48))}</td>
    <td><div style="font-weight:600">${esc((t.first_name||'')+' '+(t.last_name||''))}</div><div class="em">${esc(t.email)}</div></td>
    <td>${esc(t.category)}</td><td>${t.msg_count||0}</td>
    <td><span class="badge ${TS[t.status]?TS[t.status][0]:'b-grey'}"><span class="dot"></span>${TS[t.status]?TS[t.status][1]:t.status}</span></td>
    <td class="em">${fmtDate(t.updated_at)}</td>
    <td class="actions"><button class="btn btn-sm" data-open="${t.id}">Open</button></td></tr>`).join(''):emptyRow(cols.length,'Student portal tickets land here.');
  $('#view').innerHTML='<div class="inline-note" style="margin-bottom:16px">Conversations opened by students in the portal. Replies you send here appear in their Support tab (live mode).</div>'+tb+tableShell(cols,body,`<div class="tfoot"><span>${rows.length} ticket${rows.length===1?'':'s'}</span></div>`);
  wireToolbar(renderTickets);
  const open=id=>openAdminTicket(id);
  document.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=e=>{if(e.target.closest('button'))return;open(tr.dataset.id)});
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>open(b.dataset.open));
  renderCasework();
}
const APPEAL_T={result_appeal:'Result appeal',invalidation_appeal:'Invalidation appeal',complaint:'Complaint',ethics:'Ethics'};
const ACCOM_T={extra_time:'Extra time',separate_setting:'Separate setting',assistive_technology:'Assistive technology',other:'Other'};
async function renderCasework(){
  let ap=[],ac=[];
  try{ap=(await api('/api/admin/appeals')).rows||[];}catch(_){ }
  try{ac=(await api('/api/admin/accommodations')).rows||[];}catch(_){ }
  const stB=st=>({submitted:'b-amber',under_review:'b-blue',upheld:'b-green',approved:'b-green',dismissed:'b-grey',rejected:'b-red',withdrawn:'b-grey'})[st]||'b-grey';
  const who=r=>esc(((r.first_name||'')+' '+(r.last_name||'')).trim()||r.email||('user '+r.user_id));
  const apRows=ap.length?ap.map(r=>`<tr><td><b>${who(r)}</b><br><span class="em">${esc(APPEAL_T[r.type]||r.type)}${r.attempt_id?' · attempt #'+r.attempt_id:''}${r.credential_id?' · '+esc(r.credential_id):''}</span></td>
    <td class="em" style="max-width:340px">${esc(String(r.reason||'').slice(0,120))}${(r.reason||'').length>120?'…':''}${r.evidence_name?`<br><button class="btn btn-sm" data-apev="${r.id}">📎 ${esc(r.evidence_name)}</button>`:''}</td>
    <td><span class="badge ${stB(r.status)}">${esc(r.status.replace('_',' '))}</span>${r.decision?`<br><span class="em" style="font-size:11px">${esc(String(r.decision).slice(0,80))}</span>`:''}</td>
    <td class="actions">${['submitted','under_review'].includes(r.status)?`<button class="btn btn-sm" data-aprev="${r.id}">Mark reviewing</button> <button class="btn btn-sm btn-primary" data-apup="${r.id}">Uphold</button> <button class="btn btn-sm" data-apdis="${r.id}">Dismiss</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan="4" class="em" style="padding:14px">No appeals.</td></tr>';
  const acRows=ac.length?ac.map(r=>`<tr><td><b>${who(r)}</b><br><span class="em">${esc(ACCOM_T[r.request_type]||r.request_type)}</span></td>
    <td class="em" style="max-width:340px">${esc(String(r.description||'').slice(0,120))}${(r.description||'').length>120?'…':''}${r.evidence_name?`<br><button class="btn btn-sm" data-acev="${r.id}">📎 ${esc(r.evidence_name)}</button>`:''}</td>
    <td><span class="badge ${stB(r.status)}">${esc(r.status.replace('_',' '))}</span>${r.status==='approved'?`<br><span class="em">+${r.approved_extra_minutes} min</span>`:''}${r.admin_note?`<br><span class="em" style="font-size:11px">${esc(String(r.admin_note).slice(0,80))}</span>`:''}</td>
    <td class="actions">${['submitted','under_review'].includes(r.status)?`<button class="btn btn-sm btn-primary" data-acok="${r.id}">Approve…</button> <button class="btn btn-sm" data-acno="${r.id}">Reject…</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan="4" class="em" style="padding:14px">No accommodation requests.</td></tr>';
  $('#view').insertAdjacentHTML('beforeend',`
    <h3 style="margin:26px 0 10px">Appeals &amp; complaints <span class="badge b-amber" style="vertical-align:2px">${ap.filter(r=>['submitted','under_review'].includes(r.status)).length} open</span></h3>
    <div class="inline-note" style="margin-bottom:10px">Formal appeals are decided here; releasing or invalidating the underlying result stays in <b>Live proctoring &amp; sessions</b>.</div>
    <table class="tbl"><tr><th>Appellant</th><th>Grounds</th><th>Status</th><th></th></tr>${apRows}</table>
    <h3 style="margin:26px 0 10px">Accommodation requests <span class="badge b-amber" style="vertical-align:2px">${ac.filter(r=>['submitted','under_review'].includes(r.status)).length} open</span></h3>
    <div class="inline-note" style="margin-bottom:10px">Approved extra minutes are automatically added to the candidate's exam duration at launch (largest single approval applies).</div>
    <table class="tbl"><tr><th>Candidate</th><th>Request</th><th>Status</th><th></th></tr>${acRows}</table>`);
  const ev=(url)=>openBlob(url);
  document.querySelectorAll('[data-apev]').forEach(b=>b.onclick=()=>ev('/api/admin/appeals/'+b.dataset.apev+'/evidence'));
  document.querySelectorAll('[data-acev]').forEach(b=>b.onclick=()=>ev('/api/admin/accommodations/'+b.dataset.acev+'/evidence'));
  const apDecide=(id,status,needText)=>{ if(!needText){api('/api/admin/appeals/'+id+'/decide',{method:'POST',body:JSON.stringify({status})}).then(()=>{toast('Appeal '+status.replace('_',' '),'ok');renderTickets()});return; }
    modal((status==='upheld'?'Uphold':'Dismiss')+' appeal #'+id,'<div class="form-row"><label>Decision communicated to the candidate</label><textarea id="apDec" rows="4" placeholder="State the outcome and its basis…"></textarea></div>','Record decision',async()=>{
      const dec=($('#apDec').value||'').trim(); if(dec.length<10){toast('Please write the decision (min 10 chars)','err');return false;}
      await api('/api/admin/appeals/'+id+'/decide',{method:'POST',body:JSON.stringify({status,decision:dec})});toast('Appeal '+status,'ok');renderTickets();return true;});};
  document.querySelectorAll('[data-aprev]').forEach(b=>b.onclick=()=>apDecide(b.dataset.aprev,'under_review',false));
  document.querySelectorAll('[data-apup]').forEach(b=>b.onclick=()=>apDecide(b.dataset.apup,'upheld',true));
  document.querySelectorAll('[data-apdis]').forEach(b=>b.onclick=()=>apDecide(b.dataset.apdis,'dismissed',true));
  document.querySelectorAll('[data-acok]').forEach(b=>b.onclick=()=>{const id=b.dataset.acok;
    modal('Approve accommodation #'+id,'<div class="form-row"><label>Extra minutes granted (0–120)</label><input id="acMin" type="number" min="0" max="120" value="30"/></div><div class="form-row"><label>Note to candidate (optional)</label><input id="acNote" placeholder="e.g. Approved per supporting documentation"/></div>','Approve',async()=>{
      const mins=Math.max(0,Math.min(120,+($('#acMin').value||0)));
      await api('/api/admin/accommodations/'+id+'/decide',{method:'POST',body:JSON.stringify({status:'approved',approved_extra_minutes:mins,admin_note:$('#acNote').value.trim()})});
      toast('Approved +'+mins+' min','ok');renderTickets();return true;});});
  document.querySelectorAll('[data-acno]').forEach(b=>b.onclick=()=>{const id=b.dataset.acno;
    modal('Reject accommodation #'+id,'<div class="form-row"><label>Reason communicated to the candidate</label><textarea id="acNote2" rows="3" placeholder="State why the request cannot be approved…"></textarea></div>','Reject',async()=>{
      const note=($('#acNote2').value||'').trim(); if(note.length<10){toast('Please give a reason (min 10 chars)','err');return false;}
      await api('/api/admin/accommodations/'+id+'/decide',{method:'POST',body:JSON.stringify({status:'rejected',admin_note:note})});toast('Request rejected','ok');renderTickets();return true;});});
}
async function openAdminTicket(id){
  const t=await api('/api/admin/tickets/'+id);
  const msgs=(t.messages||[]).map(m=>`<div style="max-width:84%;padding:11px 14px;border-radius:12px;margin-bottom:9px;font-size:13px;line-height:1.55;${m.sender==='admin'?'background:var(--blue);color:#fff;margin-left:auto':'background:#fff;border:1px solid var(--line)'}">${esc(m.body)}<div style="font-size:10px;opacity:.7;margin-top:4px">${m.sender==='admin'?'PCI Support':'Student'} · ${fmtDT(m.created_at)}</div></div>`).join('');
  const setSt=st=>async()=>{await api('/api/admin/tickets/'+id+'/status',{method:'POST',body:JSON.stringify({status:st})});toast('Status: '+st.replace('_',' '),'ok');closeDrawer();renderTickets()};
  drawer('Ticket '+esc(t.reference),`${esc((t.first_name||'')+' '+(t.last_name||''))} · ${esc(t.email)} · ${esc(t.category)}`,
    `<div>${msgs}</div>
     <div class="dsection"><h5>Reply as PCI Support</h5>
       <textarea id="atMsg" rows="3" style="width:100%;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-family:inherit"></textarea>
       <div style="margin-top:10px"><button class="btn btn-primary btn-sm" id="atSend">Send reply</button></div></div>`,
    [t.status!=='resolved'?{label:'Mark resolved',cls:'btn',act:setSt('resolved')}:null,
     t.status!=='closed'?{label:'Close',cls:'btn',act:setSt('closed')}:{label:'Reopen',cls:'btn',act:setSt('open')}].filter(Boolean));
  $('#atSend').onclick=async()=>{const v=$('#atMsg').value.trim();if(!v)return;
    await api('/api/admin/tickets/'+id+'/reply',{method:'POST',body:JSON.stringify({message:v})});
    toast('Reply sent','ok');openAdminTicket(id)};
}

function sampleTickets(path,opts={}){
  const m=(opts.method||'GET').toUpperCase(), b=opts.body?JSON.parse(opts.body):{}, p=new URLSearchParams(path.split('?')[1]||''); let mm;
  const P=path.split('?')[0], ok=x=>Promise.resolve(x||{ok:true});
  if(P==='/api/admin/tickets'&&m==='GET'){let r=S.tickets;const st=p.get('status');if(st)r=r.filter(t=>t.status===st);return ok({rows:r.map(t=>{const {messages,...rest}=t;return rest})})}
  if((mm=P.match(/^\/api\/admin\/tickets\/(\d+)$/)))return ok(S.tickets.find(t=>t.id==mm[1]));
  if((mm=P.match(/^\/api\/admin\/tickets\/(\d+)\/reply$/))){const t=S.tickets.find(x=>x.id==mm[1]);t.messages.push({sender:'admin',body:b.message,created_at:new Date().toISOString()});t.msg_count=t.messages.length;t.status='awaiting_student';t.updated_at=new Date().toISOString();return ok()}
  if((mm=P.match(/^\/api\/admin\/tickets\/(\d+)\/status$/))){const t=S.tickets.find(x=>x.id==mm[1]);t.status=b.status;t.updated_at=new Date().toISOString();return ok()}
  return null;
}
