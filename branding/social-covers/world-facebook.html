<!doctype html>
<meta charset="utf-8">
<title>PCI World — Facebook cover 820×312</title>
<link rel="stylesheet" href="world-shared.css">
<style>
  html,body{width:820px;height:312px;}
  /* Facebook mobile crops to the central ~640px — keep content inside x 90…730 */
  .in{padding:0 96px;gap:32px;}
  .mark{width:118px;height:118px;}
  .eyebrow{font-size:11.5px;margin-bottom:10px;}
  h1{font-size:31px;}
  .sub{font-size:14px;max-width:520px;margin-top:11px;}
  .foot{position:absolute;left:96px;bottom:22px;z-index:2;gap:12px;}
  .bar{width:40px;height:4px;}
  .url{font-size:12px;letter-spacing:.03em;}
</style>
<div class="grid"></div>
<svg class="motif" width="820" height="312" viewBox="0 0 820 312" fill="none">
  <!-- constellation, top right -->
  <g stroke="rgba(255,255,255,.18)" stroke-width="1.2">
    <path d="M700 36 L756 70 L730 140 M756 70 L778 40 M730 140 L790 120"/>
  </g>
  <circle cx="700" cy="36"  r="3.5" fill="#C8A24B"/>
  <circle cx="756" cy="70"  r="4"   fill="rgba(255,255,255,.6)"/>
  <circle cx="730" cy="140" r="3"   fill="#3B82F6"/>
  <circle cx="778" cy="40"  r="2.5" fill="rgba(255,255,255,.5)"/>
  <circle cx="790" cy="120" r="3.5" fill="#C8A24B"/>
  <!-- back half of the orbit ring -->
  <g transform="rotate(-16 155 156)">
    <path d="M59 156 A 96 30 0 0 1 251 156" stroke="rgba(200,162,75,.32)" stroke-width="2"/>
  </g>
</svg>
<div class="in">
  <img class="mark" src="../../backend/wwwroot/assets/logo.svg" alt="">
  <div class="tx">
    <div class="eyebrow">Community &middot; Forum &middot; Careers &middot; Publishing</div>
    <h1>Where the people who control<br>projects come together<span class="dot">.</span></h1>
    <div class="sub">Community rooms, an open forum, verified careers &amp; contributor publishing.</div>
  </div>
</div>
<svg class="orbit" width="820" height="312" viewBox="0 0 820 312" fill="none">
  <g transform="rotate(-16 155 156)">
    <path d="M59 156 A 96 30 0 0 0 251 156" stroke="rgba(200,162,75,.9)" stroke-width="2"/>
    <circle cx="72" cy="141" r="4" fill="#C8A24B"/>
  </g>
</svg>
<div class="foot"><span class="bar"></span><span class="url">pciworld.org &nbsp;&middot;&nbsp; a Project Controls Institute community</span></div>
