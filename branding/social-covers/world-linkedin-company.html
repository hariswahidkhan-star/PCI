<!doctype html>
<meta charset="utf-8">
<title>PCI World — LinkedIn company cover 1128×191</title>
<link rel="stylesheet" href="world-shared.css">
<style>
  html,body{width:1128px;height:191px;}
  /* LinkedIn overlays the company logo square on the lower left — keep content right of x≈240 */
  .in{padding:0 56px 0 240px;gap:22px;}
  .mark{width:84px;height:84px;}
  .vbar{flex:0 0 auto;width:4px;height:64px;border-radius:2px;background:#C8A24B;}
  .eyebrow{font-size:10.5px;margin-bottom:7px;}
  h1{font-size:25px;white-space:nowrap;}
  .sub{font-size:12.5px;margin-top:7px;white-space:nowrap;}
  .corner{position:absolute;right:40px;bottom:22px;z-index:2;display:flex;align-items:center;gap:10px;}
  .corner .bar{width:30px;height:3px;}
  .url{font-size:12px;white-space:nowrap;}
</style>
<div class="grid"></div>
<svg class="motif" width="1128" height="191" viewBox="0 0 1128 191" fill="none">
  <g stroke="rgba(255,255,255,.18)" stroke-width="1.2">
    <path d="M40 40 L110 76 L180 40 M110 76 L110 130 M960 40 L1030 70 L1095 36 M1030 70 L1040 120"/>
  </g>
  <circle cx="40"   cy="40"  r="3"   fill="#C8A24B"/>
  <circle cx="110"  cy="76"  r="3.5" fill="rgba(255,255,255,.6)"/>
  <circle cx="180"  cy="40"  r="2.5" fill="#3B82F6"/>
  <circle cx="110"  cy="130" r="2.5" fill="rgba(255,255,255,.45)"/>
  <circle cx="960"  cy="40"  r="3"   fill="#3B82F6"/>
  <circle cx="1030" cy="70"  r="3.5" fill="#C8A24B"/>
  <circle cx="1095" cy="36"  r="2.5" fill="rgba(255,255,255,.5)"/>
  <circle cx="1040" cy="120" r="2.5" fill="rgba(255,255,255,.45)"/>
  <g transform="rotate(-16 282 96)">
    <path d="M216 96 A 66 21 0 0 1 348 96" stroke="rgba(200,162,75,.32)" stroke-width="2"/>
  </g>
</svg>
<div class="in">
  <img class="mark" src="../../backend/wwwroot/assets/logo.svg" alt="">
  <span class="vbar"></span>
  <div class="tx">
    <div class="eyebrow">Community &middot; Forum &middot; Careers &middot; Publishing</div>
    <h1>Where the people who control projects come together<span class="dot">.</span></h1>
    <div class="sub">Community rooms, an open forum, verified careers &amp; contributor publishing.</div>
  </div>
</div>
<svg class="orbit" width="1128" height="191" viewBox="0 0 1128 191" fill="none">
  <g transform="rotate(-16 282 96)">
    <path d="M216 96 A 66 21 0 0 0 348 96" stroke="rgba(200,162,75,.9)" stroke-width="2"/>
    <circle cx="225" cy="86" r="3.5" fill="#C8A24B"/>
  </g>
</svg>
<div class="corner"><span class="bar"></span><span class="url">pciworld.org &nbsp;&middot;&nbsp; a Project Controls Institute community</span></div>
