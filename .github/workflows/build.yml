name: ci
# push covers main; pull_request covers feature branches (avoids double-running both events)
on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Restore & build
        run: dotnet build -c Release

      - name: Logic tests (6 suites)
        run: |
          set -e
          for t in tests/lifecycle_test.py tests/release_test.py tests/casework_test.py tests/settings_test.py tests/publication_test.py tests/storage_test.py; do
            echo "=== $t ==="
            out=$(python3 "$t")
            echo "$out"
            # match the suites' uppercase FAIL verdicts only — case-insensitive matching
            # false-positived on healthy output like "mic off -> failed? PASS"
            if echo "$out" | grep -qE "\bFAIL\b|✗"; then echo "::error::$t reported a failure"; exit 1; fi
          done

      - name: JS syntax check (app shells)
        run: |
          set -e
          python3 - <<'PY'
          import re, subprocess, sys, tempfile, os
          shells = ['wwwroot/student.html','wwwroot/admin.html','wwwroot/exam-ui.html','wwwroot/checkout.html','wwwroot/enroll.html','wwwroot/index.html']
          fail = False
          for f in shells:
              if not os.path.exists(f): continue
              html = open(f, encoding='utf-8').read()
              blocks = [m.group(2) for m in re.finditer(r'<script([^>]*)>(.*?)</script>', html, re.S)
                        if 'src=' not in m.group(1) and 'json' not in m.group(1).lower()]
              tmp = tempfile.NamedTemporaryFile('w', suffix='.js', delete=False)
              tmp.write('\n;\n'.join(blocks)); tmp.close()
              r = subprocess.run(['node','--check',tmp.name], capture_output=True, text=True)
              print(('OK  ' if r.returncode==0 else 'FAIL')+' '+f)
              if r.returncode != 0: print(r.stderr[:400]); fail = True
          sys.exit(1 if fail else 0)
          PY

      - name: Boot the backend
        env: { PORT: '8080', DATABASE_FILE: './ci.db' }
        run: |
          dotnet bin/Release/net8.0/PCI.Backend.dll &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health && break; sleep 1; done

      - name: Live smoke suite
        run: ./smoke-test.sh

      - name: Integration suite (adversarial end-to-end)
        run: |
          if [ -f tests/integration_test.py ]; then python3 tests/integration_test.py; else echo "no integration suite yet"; fi

      - name: 500 sweep (every route x anon/student/owner)
        run: python3 tests/sweep_500_test.py

      - name: S3 storage provider live test (moto)
        run: |
          pip install --quiet 'moto[server]' || pip install --quiet --ignore-installed 'moto[server]'
          python3 tests/storage_s3_test.py

      - name: System-check endpoint gated
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/admin/system-check)
          # 401 (needs owner auth) proves the route exists and is gated; 200 would require a session.
          if [ "$code" = "401" ] || [ "$code" = "200" ]; then echo "system-check gated OK ($code)"; else echo "::error::system-check returned $code"; exit 1; fi

  secureexam-windows:
    runs-on: windows-latest      # WPF client needs Windows to compile
    defaults: { run: { working-directory: secureexam } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore PCI.SecureExam.sln
      - run: dotnet build PCI.SecureExam.sln -c Release --no-restore
      - run: dotnet test PCI.SecureExam.Tests/PCI.SecureExam.Tests.csproj -c Release --no-build --logger trx

  secureexam-core-linux:
    runs-on: ubuntu-latest       # Core + tests are cross-platform
    defaults: { run: { working-directory: secureexam } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test PCI.SecureExam.Tests/PCI.SecureExam.Tests.csproj -c Release
