name: ci
# push covers main; pull_request covers feature branches (avoids double-running both events)
on:
  push: { branches: [main] }
  pull_request: {}

# SQ-11 — least-privilege default token. No job in this workflow writes to the repo, so the
# GITHUB_TOKEN is read-only everywhere; any job that ever needs more must opt in explicitly.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Restore & build
        run: dotnet build -c Release

      - name: Production and staging fail closed before database open
        run: python3 tests/production_config_test.py

      - name: MySQL schema-generator parser tests (table scan + index key lengths)
        run: python3 tests/schema_generator_test.py

      - name: Logic tests (17 suites)
        run: |
          set -e
          # passport_documents_test's section D parses assembled PDFs with pypdf; install it here
          # so CI runs the strong form (the suite degrades to an explicit SKIP without it).
          pip install --quiet --break-system-packages pypdf || pip install --quiet pypdf || true
          for t in tests/lifecycle_test.py tests/release_test.py tests/casework_test.py tests/settings_test.py tests/publication_test.py tests/storage_test.py tests/student_number_test.py tests/student_number_backfill_test.py tests/events_defects_test.py tests/world_og_metadata_test.py tests/world_passport_verify_test.py tests/identity_merge_test.py tests/portal_handoff_test.py tests/world_claim_referral_test.py tests/passport_summary_test.py tests/world_share_caption_test.py tests/passport_documents_test.py; do
            echo "=== $t ==="
            out=$(python3 "$t")
            echo "$out"
            # match the suites' uppercase FAIL verdicts only — case-insensitive matching
            # false-positived on healthy output like "mic off -> failed? PASS"
            if echo "$out" | grep -qE "\bFAIL\b|✗"; then echo "::error::$t reported a failure"; exit 1; fi
          done

      - name: JS syntax check (app shells)
        run: |
          set -e
          python3 - <<'PY'
          import re, subprocess, sys, tempfile, os
          shells = ['wwwroot/student.html','wwwroot/admin.html','wwwroot/exam-ui.html','wwwroot/checkout.html','wwwroot/enroll.html','wwwroot/index.html']
          fail = False
          for f in shells:
              if not os.path.exists(f): continue
              html = open(f, encoding='utf-8').read()
              blocks = [m.group(2) for m in re.finditer(r'<script([^>]*)>(.*?)</script>', html, re.S)
                        if 'src=' not in m.group(1) and 'json' not in m.group(1).lower()]
              tmp = tempfile.NamedTemporaryFile('w', suffix='.js', delete=False)
              tmp.write('\n;\n'.join(blocks)); tmp.close()
              r = subprocess.run(['node','--check',tmp.name], capture_output=True, text=True)
              print(('OK  ' if r.returncode==0 else 'FAIL')+' '+f)
              if r.returncode != 0: print(r.stderr[:400]); fail = True
          sys.exit(1 if fail else 0)
          PY

      - name: Boot the backend
        env: { ASPNETCORE_ENVIRONMENT: Development, PORT: '8080', DATABASE_FILE: './ci.db' }
        run: |
          dotnet bin/Release/net8.0/PCI.Backend.dll &
          # Fresh CI DBs run a full wwwroot content scan + seed (~15–40s on shared runners).
          # Fail hard if health never answers — otherwise smoke starts against a dead port.
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/api/health; then
              echo
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not become healthy within 90s"
          exit 1

      - name: Live smoke suite
        run: ./smoke-test.sh

      - name: Integration suite (adversarial end-to-end)
        run: |
          # pypdf enables full text-extraction assertions on generated/watermarked PDFs
          # (the suite degrades gracefully without it, but CI runs the strong form)
          pip install --quiet --break-system-packages pypdf || pip install --quiet pypdf || true
          if [ -f tests/integration_test.py ]; then python3 tests/integration_test.py; else echo "no integration suite yet"; fi

      - name: PCI World community rooms — guest journey over live HTTP
        # Boots its own backend. Asserts the slice's core invariant end to end: a blocked message
        # is invisible to a second participant, and with no moderation provider nothing publishes.
        run: python3 tests/community_test.py

      - name: PCI World community rooms — abuse and failure drills
        # Attacks the same journeys: floods, forged tokens, oversized and malformed payloads, a
        # crashed broadcast worker, duplicate delivery, and a moderation provider outage mid
        # conversation. Asserts the system fails toward silence rather than toward publication.
        run: python3 tests/community_abuse_test.py

      - name: PCI World community images — upload, scan and publication boundary
        # Phase 2. Drives the real endpoints AND the background scan worker, and its core
        # assertions are negative: a second participant cannot load an image before the allow
        # verdict, and can never load one that was withheld or restricted. Fixtures are generated
        # PNGs carrying a marker pixel the deterministic test scanner reads — no real harmful
        # material is involved.
        run: python3 tests/community_images_test.py

      - name: PCI World forum — trust-graded publication, crawlable page, flags
        # Phase 3. The load-bearing assertions are about what reaches the SERVER-RENDERED page:
        # that output is cached by search engines, so a held or withheld post escaping onto it can
        # outlive the deletion meant to fix it. Also covers the flag cap — one member cannot hide a
        # post — and that a flag sanctions nobody.
        run: python3 tests/forum_test.py

      - name: PCI World careers — verification gate, tenant isolation, frozen application snapshots
        # Phase 4. Every serious failure mode on this surface is a DISCLOSURE rather than a crash —
        # a fake employer that publishes, a suspended one that keeps reading CVs, one tenant seeing
        # another's applicants — so none of it shows up as a 500 the sweep would catch. Each control
        # is probed by more than one route, because a check present on the happy path and absent on
        # the second route is the recurring defect this increment keeps finding.
        run: python3 tests/careers_test.py

      - name: PCI World contributor publishing — maker-checker across two identity systems
        # Phase 6. The load-bearing assertions are K10-K14: the editorial engine's maker-checker
        # compares admin ids, while a contributor is a pciworld_users row, so for a contributor's
        # manuscript the original comparison could never fire — a control that reads exactly like a
        # control and does nothing. These tests fail if the cross-namespace check is removed.
        run: python3 tests/contributors_test.py

      - name: PCI World launch board — owner-only, and the image flag will not move on a keystroke
        # The one screen where a mistake is a launch. Two things it must never become: a way for a
        # non-owner to switch a feature on, and a general owner-gated settings write (C09 pins that
        # — it is owner-gated and takes a key/value pair, which is one careless line from writing
        # any setting at all). C21/C22 are the load-bearing pair: the OWNER is refused the community
        # image flag while the moderation prerequisite is unrecorded, and the DATABASE is checked,
        # because the response is the endpoint's own account of what it did.
        run: python3 tests/world_launch_test.py

      - name: Impersonation read-only regression (P0-1 — central fail-closed enforcement)
        run: python3 tests/impersonation_readonly_test.py

      - name: Retake waiting-period regression (P0-7 — persisted, enforced at booking, admin-waivable)
        run: python3 tests/retake_wait_test.py

      - name: Migration versioning + lock regression (P0-6 — ledger, compatibility gate, concurrent boot)
        run: python3 tests/migration_versioning_test.py

      - name: Stripe fulfillment replay-safety regression (P0-2 — paid gate, async success, replay no-op)
        run: python3 tests/payments_replay_test.py

      - name: Worker leasing regression (EXT-P0-05 — atomic claim, crash recovery, exactly-once delivery)
        run: python3 tests/worker_leasing_test.py

      - name: Waiver idempotency regression (RES-026 — durable request key on every waiver grant)
        run: python3 tests/waiver_idempotency_test.py

      - name: Vendor-stall availability regression (no network I/O under the global DB lock)
        run: python3 tests/waiver_vendor_stall_test.py

      - name: Upload malware policy (RES-021 — one policy on every upload door, fail-closed scanner)
        run: |
          # A configured-but-unreachable scanner must REJECT, never wave the file through. Proving that
          # needs the env var set for the run, which the xUnit tier covers; here we assert the built-in
          # signatures reject an EICAR upload through the real HTTP evidence path.
          python3 - <<'PY'
          import base64, json, urllib.request, urllib.error
          eicar = base64.b64encode(rb"X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*").decode()
          req = urllib.request.Request("http://127.0.0.1:8080/api/me/documents",
              data=json.dumps({"file": "data:application/pdf;base64," + eicar}).encode(),
              headers={"Content-Type": "application/json"}, method="POST")
          try:
              urllib.request.urlopen(req); code = 200
          except urllib.error.HTTPError as e:
              code = e.code
          # Unauthenticated (401) or rejected (400) are both fine; a 2xx would mean it was stored.
          assert code != 200, "EICAR upload was accepted"
          print(f"EICAR upload refused (HTTP {code})")
          PY

      - name: Founding-stage suite (codes, applications, waiver settlement)
        run: python3 tests/founding_test.py

      - name: Honorary suite (board-only awards, PCI-HON verify, credential separation)
        run: python3 tests/honorary_test.py

      - name: Honorary application suite (public apply → review → confer, uploads, notifications, confirm-pw)
        run: python3 tests/honorary_application_test.py

      - name: 500 sweep (every route x anon/student/owner)
        run: python3 tests/sweep_500_test.py

      - name: Migration & DB-integrity suite (idempotent double boot, schema.sql conformance, sentinel)
        run: python3 tests/migration_integrity_test.py

      - name: S3 storage provider live test (moto, non-blocking)
        # S3 is an OPTIONAL provider. Its live test needs a mock S3 server (moto), which does not run
        # reliably on the hosted runner, so this step is informational only (continue-on-error) — it must
        # never gate the pipeline. The S3 provider is verified locally against moto (9/9, see the changelog)
        # and should be re-run against a real bucket before relying on it in production.
        continue-on-error: true
        run: |
          pip install --quiet --break-system-packages 'moto[server]' \
            || pip install --quiet 'moto[server]' \
            || pip install --quiet --user 'moto[server]' \
            || echo "moto install failed — storage_s3_test.py will self-skip"
          python3 tests/storage_s3_test.py

      - name: System-check endpoint gated
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/admin/system-check)
          # 401 (needs owner auth) proves the route exists and is gated; 200 would require a session.
          if [ "$code" = "401" ] || [ "$code" = "200" ]; then echo "system-check gated OK ($code)"; else echo "::error::system-check returned $code"; exit 1; fi

  backend-mysql:
    # Production-parity gate: same adversarial suite + migration integrity on MariaDB/MySQL.
    # SQLite `backend` is the fast smoke; this job is the database that holds production money.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      mysql:
        image: mariadb:10.11
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: pci, MARIADB_USER: pci, MARIADB_PASSWORD: pcipass }
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet build -c Release
      - name: Generated MySQL schema is current
        run: python3 tools/sqlite_to_mysql.py --check
      - name: Grant the pci user database-create rights (for the test harness reset)
        run: mysql -h 127.0.0.1 -uroot -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'pci'@'%'; FLUSH PRIVILEGES;"
      - name: Adversarial integration suite against MySQL
        env:
          TEST_DB_PROVIDER: mysql
          REQUIRE_MYSQL_TEST: '1'
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: pci
          MYSQL_PASSWORD: pcipass
          MYSQL_DATABASE: pci
          MYSQL_SSL: 'false'
        run: |
          pip install --quiet --break-system-packages pymysql pypdf || pip install --quiet pymysql pypdf
          python3 tests/integration_test.py
          python3 tests/community_test.py
          python3 tests/community_abuse_test.py
          python3 tests/community_images_test.py
          python3 tests/forum_test.py
          python3 tests/careers_test.py
          python3 tests/contributors_test.py
          python3 tests/world_launch_test.py
          python3 tests/founding_test.py
          python3 tests/honorary_test.py
          python3 tests/honorary_application_test.py

      - name: Migration & DB-integrity suite (full mode incl. SQLite/MySQL schema parity)
        env:
          TEST_DB_PROVIDER: mysql
          REQUIRE_MYSQL_TEST: '1'
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: pci
          MYSQL_PASSWORD: pcipass
          MYSQL_DATABASE: pci
          MYSQL_SSL: 'false'
        run: |
          pip install --quiet --break-system-packages pymysql || pip install --quiet pymysql
          python3 tests/migration_integrity_test.py

      - name: DR-1 backup → restore round-trip
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: pci
          MYSQL_PASSWORD: pcipass
        run: python3 tests/backup_restore_test.py

  backend-mysql8:
    # Oracle MySQL has a distinct DDL path (notably no CREATE INDEX IF NOT EXISTS).
    # Double-boot migration integrity is a required gate, not inferred from MariaDB compatibility.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pci
          MYSQL_USER: pci
          MYSQL_PASSWORD: pcipass
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet build -c Release
      - name: Grant reset rights to isolated test schemas
        run: mysql -h 127.0.0.1 -uroot -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'pci'@'%'; FLUSH PRIVILEGES;"
      - name: Oracle MySQL double-boot, schema, index, and money parity
        env:
          TEST_DB_PROVIDER: mysql
          REQUIRE_MYSQL_TEST: '1'
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: pci
          MYSQL_PASSWORD: pcipass
          MYSQL_DATABASE: pci
          MYSQL_SSL: 'false'
        run: |
          pip install --quiet --break-system-packages pymysql || pip install --quiet pymysql
          python3 tests/migration_integrity_test.py

  backend-unit-mysql:
    # The xUnit layer, run against a real MariaDB instead of SQLite.
    #
    # Production runs MySQL only — SQLite is a dev/test convenience — so logic verified solely on SQLite
    # is logic nobody has checked against the database that actually holds the money. The ix_plc_link
    # defect (an index MySQL rejected while SQLite accepted it, swallowed by the installer) is exactly
    # what that blind spot produces, and schema parity alone would not have caught a behavioural
    # difference in SUM(), type affinity or date comparison.
    #
    # This used to be scoped to the finance suites, because the between-test reset was a hand-written list
    # of "tables the tests own" that only ever covered the finance module — every other suite therefore ran
    # against whatever the previous test had left behind. TestEnv now resets the run database to its exact
    # post-migration state instead, with no list to rot, so the whole suite runs here. Widening it found
    # three defects that were live on MySQL only: the comms and marketing retry schedulers, and the
    # integration-health endpoint.
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: pci, MARIADB_USER: pci, MARIADB_PASSWORD: pcipass }
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Create the unit-test database and grant rights
        # A dedicated database (pci_unit) so a unit run can never touch the one the integration suites use.
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS pci_unit CHARACTER SET utf8mb4;"
          mysql -h 127.0.0.1 -uroot -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'pci'@'%'; FLUSH PRIVILEGES;"
      - name: Full unit suite against MySQL
        env:
          TEST_DB_PROVIDER: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: pci
          MYSQL_PASSWORD: pcipass
          MYSQL_DATABASE: pci
          MYSQL_SSL: 'false'
        # Collections run one at a time because the MySQL leg shares ONE database for the run — two
        # collections in flight would reset it out from under each other. It costs nothing here: a MySQL
        # reset is a single statement batch, where SQLite re-migrates 175 tables per test, so this leg
        # finishes in about a minute against the SQLite leg's several.
        run: >-
          dotnet test backend/tests/PCI.Backend.Tests/PCI.Backend.Tests.csproj -c Release
          -- xUnit.ParallelizeTestCollections=false

  backend-unit:
    # Hermetic xUnit layer over backend logic the live-HTTP suites cannot reach directly (retention
    # sweeps, token/crypto helpers, egress/redirect guards, storage intake). Temp SQLite + temp
    # storage root; no server boot, no network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Backend unit tests with Cobertura coverage
        run: >-
          dotnet test backend/tests/PCI.Backend.Tests/PCI.Backend.Tests.csproj -c Release
          --collect:"XPlat Code Coverage"
          --results-directory backend/tests/PCI.Backend.Tests/TestResults
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: backend/tests/PCI.Backend.Tests/TestResults/**/coverage.cobertura.xml
          retention-days: 30
          if-no-files-found: error

  frontend:
    # Stage 3 React student portal: typecheck + Vitest unit/component tests + production build.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }   # this job never needs a browser; only the e2e job does
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (ESLint — SQ-2, blocks on errors; warnings are advisory)
        run: npm run lint
      - name: Production dependency audit (SQ-6 — high/critical in shipped deps block)
        # Dev-tooling advisories (vite/vitest chain) are intentionally out of scope: they never ship
        # to users. --omit=dev scans only runtime dependencies; --audit-level=high gates on high+.
        run: npm audit --omit=dev --audit-level=high
      - name: Unit + component tests with coverage (Vitest + React Testing Library)
        run: npm run test:coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 30
          if-no-files-found: error
      - name: Production build (student + admin + world + world-admin)
        run: npm run build
      - name: Fail if any app produced no assets
        run: |
          test -f dist/index.html && ls dist/assets/*.js >/dev/null
          test -f dist-admin/admin.html && ls dist-admin/assets/*.js >/dev/null
          test -f dist-world/world.html && ls dist-world/assets/*.js >/dev/null
          test -f dist-worldadmin/worldadmin.html && ls dist-worldadmin/assets/*.js >/dev/null

  secureexam-windows:
    runs-on: windows-latest      # WPF client needs Windows to compile
    defaults: { run: { working-directory: secureexam } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore PCI.SecureExam.sln
      - run: dotnet build PCI.SecureExam.sln -c Release --no-restore
      - run: dotnet test PCI.SecureExam.Tests/PCI.SecureExam.Tests.csproj -c Release --no-build --logger trx

  secureexam-core-linux:
    runs-on: ubuntu-latest       # Core + tests are cross-platform
    defaults: { run: { working-directory: secureexam } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test PCI.SecureExam.Tests/PCI.SecureExam.Tests.csproj -c Release

  e2e:
    # Browser E2E + axe accessibility (Playwright) over the backend-served public site. Playwright's
    # webServer boots the built backend DLL and waits for /api/health, then runs the specs headless.
    # GATING since it accumulated a long unbroken green history across the coverage-programme heads —
    # a red browser run now blocks the pipeline like any other job.
    # SQLite smoke for speed; `e2e-mysql` below is the production-parity UI→API→DB gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build backend (served by Playwright's webServer)
        working-directory: backend
        run: dotnet build -c Release
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Stage the React bundles into wwwroot (so /app, /admin and /world-app are served)
        working-directory: frontend
        run: ./stage-bundles.sh

      - name: Install Playwright browser matrix
        working-directory: frontend
        # Chromium runs the full suite; Firefox/WebKit power cross-browser smoke + mobile profiles.
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Playwright E2E + axe (boots the backend on :8080)
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 30
          if-no-files-found: ignore

  e2e-mysql:
    # The same browser suite, driven against a real MariaDB instead of a SQLite file.
    #
    # Every layer below this one already runs on both engines — the xUnit suite, the live-HTTP
    # integration suite, the migration-integrity index parity check. The browser journeys were the
    # last that never had, which meant the only database production actually runs was unexercised by
    # the tests closest to what a student sees. Chromium only: the cross-browser projects are a smoke
    # subset whose value is engine coverage, not database coverage, so running them twice buys nothing.
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: pci_e2e, MARIADB_USER: pci, MARIADB_PASSWORD: pcipass }
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build backend (served by Playwright's webServer)
        working-directory: backend
        run: dotnet build -c Release
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Stage the React bundles into wwwroot (so /app, /admin and /world-app are served)
        # Same staging as the SQLite `e2e` job — the React routes must exist on BOTH legs, or the
        # MySQL leg quietly tests a site whose /world-app is a 404.
        working-directory: frontend
        run: ./stage-bundles.sh
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E on MySQL (Chromium)
        working-directory: frontend
        env:
          E2E_DB_PROVIDER: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_DATABASE: pci_e2e
          MYSQL_USER: pci
          MYSQL_PASSWORD: pcipass
          MYSQL_SSL: 'false'
        run: npx playwright test --project=chromium
      - name: Upload Playwright MySQL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mysql
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 30
          if-no-files-found: ignore

  # The deployment artifact itself: build the root Dockerfile and BOOT the image against the
  # production database provider (MySQL 8.4, matching render.yaml's DB_PROVIDER=mysql), with
  # representative production env. Every prior job tests source builds; deploys were failing on
  # container boot (entrypoint/env/preflight) while CI stayed green because nothing exercised the
  # image. BLOCKING: a Docker build error, missing static bundle, boot refusal, or unhealthy
  # /api/health fails the pipeline.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t pci-platform-ci .

      - name: Boot MySQL 8.4 + the image, wait for /api/health
        run: |
          set -e
          docker network create pci-ci
          docker run -d --name pci-db --network pci-ci \
            -e MYSQL_ROOT_PASSWORD=ci-root -e MYSQL_DATABASE=pci \
            -e MYSQL_USER=pci -e MYSQL_PASSWORD=ci-password \
            mysql:8.4
          docker run -d --name pci-app --network pci-ci -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e DB_PROVIDER=mysql -e MYSQL_HOST=pci-db -e MYSQL_DATABASE=pci \
            -e MYSQL_USER=pci -e MYSQL_PASSWORD=ci-password -e MYSQL_SSL=false \
            -e MYSQL_CONNECT_RETRIES=20 \
            -e APP_BASE_URL=https://pci-ci.example.org \
            -e ALLOWED_ORIGIN=https://pci-ci.example.org \
            -e CREDENTIAL_ENCRYPTION_KEY=ci-only-key-0123456789abcdef0123456789abcdef \
            pci-platform-ci
          echo "waiting for /api/health…"
          for i in $(seq 1 60); do
            # the container must still be running — a boot refusal (exit 70/75/78) fails fast here
            if [ "$(docker inspect -f '{{.State.Running}}' pci-app)" != "true" ]; then
              echo "::error::app container exited before becoming healthy"; exit 1
            fi
            if curl -fsS http://localhost:8080/api/health > /tmp/health.json 2>/dev/null; then
              cat /tmp/health.json; echo; break
            fi
            sleep 5
            if [ "$i" = 60 ]; then echo "::error::/api/health never became ready"; exit 1; fi
          done

      - name: Health reports the production database provider
        run: |
          set -e
          curl -fsS http://localhost:8080/api/health | tee /tmp/health.json
          grep -q '"database_provider":"mysql"' /tmp/health.json

      - name: Surfaces answer (site, student app, admin app, world app)
        run: |
          set -e
          for path in / /app/ /admin/ /world-app/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path")
            echo "$path -> $code"
            case "$code" in 200|301|302|308) ;; *) echo "::error::$path returned $code"; exit 1;; esac
          done

      - name: Container logs (always — the boot transcript is the diagnostic)
        if: always()
        run: docker logs pci-app 2>&1 | tail -200 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f pci-app pci-db 2>/dev/null || true
          docker network rm pci-ci 2>/dev/null || true

  static-quality:
    # Static-quality & supply-chain gates (Increment A). BLOCKING: the NuGet vulnerable-package
    # report (via an allow-list-aware wrapper) and secret scanning. INFORMATIONAL for now (a baseline
    # is being established before promotion to blocking): workflow linting and Dockerfile linting.
    # Container image tags are version-pinned; the first CI run establishes the observed baseline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Restore backend (needed for the vulnerable-package report)
        working-directory: backend
        run: dotnet restore

      - name: NuGet vulnerability gate (SQ-5 — blocks on any non-allow-listed advisory)
        working-directory: backend
        run: python3 tools/check_nuget_vulns.py

      - name: Secret scan (gitleaks — SQ-7, blocking)
        # Filesystem scan of the checked-out tree (--no-git), using the repo's .gitleaks.toml
        # allow-list. Exits non-zero on any finding outside the documented test-fixture exceptions.
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source=/repo --no-git --config=/repo/.gitleaks.toml --redact --verbose

      - name: Workflow lint (actionlint — SQ-11, informational baseline)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: Dockerfile lint (hadolint — SQ-10, informational baseline)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint:v2.12.0 hadolint Dockerfile
