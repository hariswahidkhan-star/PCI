# Render Blueprint — deploys the whole PCI platform (website + student panel + admin dashboard)
# as one Docker web service. The DATABASE is SQLite on the persistent disk; that same disk holds
# uploaded files (evidence, ID documents, attachments).
#
# Use: push this repo to GitHub → Render dashboard → New → Blueprint → select the repo.
# Render reads this file and provisions everything; you only fill in the env-var values
# marked sync:false (they are secrets/deployment-specific, never committed).
#
# DATABASE — SQLite at /data/pci.db on the 5 GB persistent disk. This deploys with NO external
# database service and no credentials to fill in, which is why it is the default here: Render has
# no managed MySQL, so requiring MySQL meant every deploy failed its health check (exit 78) until
# somebody provisioned and paid for a database elsewhere. The disk is durable across deploys and
# restarts, so the database survives; it is NOT durable if the service is deleted, so take backups
# (DEPLOY.md → “Backups”).
#
# The app's production preflight accepts this posture on its own terms — a SQLite file on a
# WRITABLE /data mount is the platform's documented interim deployment and needs no override. The
# explicit ALLOW_SQLITE_IN_PRODUCTION below is belt-and-braces: it keeps the boot green even if the
# disk is still attaching when the preflight runs its write probe. Every other production check
# (HTTPS base URL, explicit CORS origin, at-rest encryption key, legacy-token ban, Stripe webhook
# secret) stays fully active — this waives the MySQL requirement and nothing else.
#
# MOVING TO MySQL later (recommended once traffic or a second instance justifies it): set
# DB_PROVIDER=mysql plus MYSQL_HOST / MYSQL_USER / MYSQL_PASSWORD / MYSQL_DATABASE / MYSQL_SSL in
# Settings → Environment, and run the one-time data migration first
# (backend/tools/migrate_sqlite_to_mysql.py); see docs/MYSQL_MIGRATION.md. DB_PROVIDER=mysql takes
# precedence over everything below, so the switch is a dashboard change with no edit to this file.

services:
  - type: web
    name: pci-platform
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: pci-data          # the SQLite database AND uploaded files — the one durable store
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: STORAGE_ROOT
        value: /data/storage
      # ---- runtime stability on small hosts (also baked into the Dockerfile) ----
      # W^X off: .NET 8's write-xor-execute JIT default segfaults on boot (exit 139) on hosts
      # without the kernel memfd support it needs — the exact failure seen on Render deploys of
      # images that boot green in CI. Workstation GC fits the 512 MB Starter instance.
      - key: DOTNET_EnableWriteXorExecute
        value: "0"
      - key: DOTNET_gcServer
        value: "0"
      # ---- database: SQLite on the persistent disk (no external database needed) ----
      # Set explicitly rather than omitted: this service may already carry DB_PROVIDER=mysql in its
      # dashboard environment, and a blueprint only overwrites keys it actually declares.
      - key: DB_PROVIDER
        value: sqlite
      # Must live under the /data mount. The Dockerfile already defaults to this path; naming it
      # here as well keeps the durable location visible in the dashboard instead of implicit in an
      # image layer. Any path outside /data is wiped on every redeploy, and the app refuses to boot
      # on one rather than quietly serving a database that is about to vanish.
      - key: DATABASE_FILE
        value: /data/pci.db
      - key: ALLOW_SQLITE_IN_PRODUCTION
        value: "true"
      # ---- data-at-rest encryption (REQUIRED in production) ----
      # A 32-byte key used to AES-256-GCM encrypt stored identity documents and displayable
      # credentials. Production refuses to boot without it (exit 78).
      #
      # generateValue, not sync:false. A blank required secret guarantees that the FIRST deploy of a
      # new service fails its health check, which is precisely how this key bricked deploys before:
      # the preflight that requires it shipped in the same release as the key itself, so every
      # subsequent commit re-reported a failure nobody had introduced. Render generates this once at
      # service creation and then leaves it alone.
      #
      # It does NOT overwrite a value that already exists, so an existing service keeps the key its
      # data was encrypted under. Rotating it still requires re-encrypting existing artefacts — to
      # move to a vault-managed key, set the value explicitly on the dashboard and re-encrypt.
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      # ---- fill these in on the Render dashboard (Settings → Environment) ----
      # The service's own Render subdomain, derived from `name: pci-platform` above. Both are set
      # here rather than left sync:false because they are NOT secrets and NOT deployment-specific
      # guesses — they follow from the service name in this same file, and leaving them blank made
      # the app exit 78 on every boot with nothing to show for it. Point them at a custom domain
      # the day one is attached; ALLOWED_ORIGIN must stay exactly equal to APP_BASE_URL with no
      # trailing slash, or the browser preflight fails in a way that looks like a broken API.
      - key: APP_BASE_URL
        value: https://pci-platform.onrender.com
      - key: ALLOWED_ORIGIN        # same value as APP_BASE_URL (no trailing slash)
        value: https://pci-platform.onrender.com
      - key: ADMIN_OWNER_EMAIL     # your real admin email (replaces owner@pci.local on first boot)
        sync: false
      - key: ADMIN_OWNER_PASSWORD  # strong bootstrap password (change it in Settings → Security after first login)
        sync: false
      - key: STRIPE_SECRET_KEY     # optional until you enable payments (sk_test_… first, sk_live_… at go-live)
        sync: false
      - key: STRIPE_WEBHOOK_SECRET # required as soon as STRIPE_SECRET_KEY is set (whsec_… from the Stripe webhook)
        sync: false
      - key: RESEND_API_KEY        # easiest email option: one key from resend.com (MAIL_FROM sets the sender)
        sync: false
      - key: SMTP_HOST             # classic SMTP alternative; without either, emails print to the service logs
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
