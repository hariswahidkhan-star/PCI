# Render Blueprint — deploys the whole PCI platform (website + student panel + admin dashboard)
# as one Docker web service. The DATABASE is MySQL (required); the persistent disk holds only
# uploaded files (evidence, ID documents, attachments).
#
# Use: push this repo to GitHub → Render dashboard → New → Blueprint → select the repo.
# Render reads this file and provisions everything; you only fill in the env-var values
# marked sync:false (they are secrets/deployment-specific, never committed).
#
# DATABASE (MySQL 8.x / MariaDB 10.11+, InnoDB, utf8mb4): Render does not offer managed MySQL,
# so use an external managed MySQL (e.g. PlanetScale, Aiven, AWS RDS, DigitalOcean) and set the
# MYSQL_* values below. SQLite is NOT used in production — the app refuses to boot in Production
# unless DB_PROVIDER=mysql (there is no silent SQLite fallback). Run the one-time data migration
# (backend/tools/migrate_sqlite_to_mysql.py) before first cutover; see docs/MYSQL_MIGRATION.md.

services:
  - type: web
    name: pci-platform
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: pci-data          # uploaded files only (the database lives in managed MySQL)
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: STORAGE_ROOT
        value: /data/storage
      # ---- database: external managed MySQL (required in production) ----
      - key: DB_PROVIDER
        value: mysql
      - key: MYSQL_HOST          # managed MySQL hostname
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_DATABASE
        value: pci
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL           # "required" for managed providers; "false" only for a private-network DB
        value: required
      # ---- data-at-rest encryption (REQUIRED in production) ----
      # A 32-byte key (base64, hex, or a long passphrase) used to AES-256-GCM encrypt stored identity
      # documents and displayable credentials. Production refuses to boot without it. Generate one with:
      #   openssl rand -base64 32
      # Store it in a vault; rotating it requires re-encrypting existing artefacts.
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      # ---- fill these in on the Render dashboard (Settings → Environment) ----
      - key: APP_BASE_URL          # your public URL, e.g. https://pci-platform.onrender.com or https://www.yourdomain.org
        sync: false
      - key: ALLOWED_ORIGIN        # same value as APP_BASE_URL (no trailing slash)
        sync: false
      - key: ADMIN_OWNER_EMAIL     # your real admin email (replaces owner@pci.local on first boot)
        sync: false
      - key: ADMIN_OWNER_PASSWORD  # strong bootstrap password (you are forced to change it at first login anyway)
        sync: false
      - key: STRIPE_SECRET_KEY     # optional until you enable payments (sk_test_… first, sk_live_… at go-live)
        sync: false
      - key: STRIPE_WEBHOOK_SECRET # required as soon as STRIPE_SECRET_KEY is set (whsec_… from the Stripe webhook)
        sync: false
      - key: RESEND_API_KEY        # easiest email option: one key from resend.com (MAIL_FROM sets the sender)
        sync: false
      - key: SMTP_HOST             # classic SMTP alternative; without either, emails print to the service logs
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
